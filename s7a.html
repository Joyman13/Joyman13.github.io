        // --- Helper Functions ---
        const getWeekStart = (dateStr) => {
            const d = new Date(dateStr);
            const day = d.getDay() || 7;
            d.setDate(d.getDate() - day + 1);
            return d.toISOString().split('T')[0];
        };
        const isSameWeek = (d1, d2) => getWeekStart(d1) === getWeekStart(d2);
        const isLastWeek = (d1, current) => {
            const lastWeekDate = new Date(current);
            lastWeekDate.setDate(lastWeekDate.getDate() - 7);
            return isSameWeek(d1, lastWeekDate.toISOString().split('T')[0]);
        };
        const getTodayLocalStr = () => {
            const d = new Date();

        const getCurrentWeekStartStr = () => {
            const d = new Date();
            const day = d.getDay() || 7;
            d.setDate(d.getDate() - day + 1);

        const thaiDate = (d) => { try { return new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return String(d); } };

        const parseCSV = (str) => {
            const result = [];
            let inQuotes = false, curr = '', row = [];
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { row.push(curr.trim()); curr = ''; }
                else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && str[i+1] === '\n') i++;
                    row.push(curr.trim());
                    if (row.join('') !== '') result.push(row);
                    row = []; curr = '';
                } else { curr += char; }
            }
            if (curr !== '' || row.length > 0) { row.push(curr.trim()); result.push(row); }
            return result;
        };

            const blob = new Blob(["\uFEFF" + content], { type: 'text/csv;charset=utf-8;' });

            link.setAttribute("href", url);
            link.setAttribute("download", filename);

            // Filter out cancelled leaves dynamically for live views

                                            <p className="text-[10px] text-white/70">{isAdmin ? 'ผู้ดูแลระบบ' : 'ครู'}</p>
                                        </div>
                                        <button onClick={handleLogout} title="ออกจากระบบ" className="w-9 h-9 rounded-full hover:bg-white/20 flex items-center justify-center transition"><i className="fas fa-right-from-bracket"></i></button>
                                    </React.Fragment>
                                ) : (
                                    <button onClick={() => setAuthModal({ isOpen: true, targetTab: activeTab })} className="px-4 py-1.5 rounded-full bg-white text-indigo-600 text-sm font-bold hover:bg-indigo-50 transition"><i className="fas fa-right-to-bracket mr-1"></i>เข้าสู่ระบบ</button>
                                )}
                            </div>
                        </div>
                        <div className="bg-white/10 border-t border-white/10">
                            <div className="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto custom-scrollbar">
                                {ALL_TABS.filter(t => !t.adminOnly || isAdmin).map(tab => (
                                    <button key={tab.id} onClick={() => handleTabClick(tab.id)} className={'flex items-center gap-1.5 px-3.5 py-2.5 text-sm font-medium whitespace-nowrap transition border-b-2 ' + (activeTab === tab.id ? 'bg-white/20 text-white border-white' : 'text-white/70 border-transparent hover:bg-white/10 hover:text-white')}>
                                        <i className={'fas ' + tab.icon}></i><span className="hidden sm:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 no-print">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'leaves' && renderLeaves()}
                        {activeTab === 'tasks' && renderTasks()}
                        {activeTab === 'slip' && renderSlip()}
                        {activeTab === 'schedule' && renderSchedule()}
                        {activeTab === 'reports' && renderReports()}
                        {activeTab === 'manage' && renderManage()}
                        {activeTab === 'settings' && renderSettings()}
                    </main>

                    {/* [คืนค่า] ใบส่งสอนแทนรายวัน — เอกสารสำหรับพิมพ์ (แสดงเฉพาะตอนสั่งพิมพ์จากแท็บใบส่งสอนแทน) */}
                    {activeTab === 'slip' && (
                        <div id="printable-slip" className="hidden print-only">
                            <div className="p-2">
                                {renderSlipDocument()}
                            </div>
                        </div>
                    )}

                    {/* รายงานสำหรับพิมพ์ (แสดงเฉพาะตอนสั่งพิมพ์จากแท็บรายงาน) */}
                    {activeTab === 'reports' && (() => {
                        const rt = adminTasks;
                        const today = getTodayLocalStr();
                        const rows = activeTeachers.filter(t => t.role === 'teacher').map(t => ({
                            t,
                            week: rt.filter(x => x.assignedTo === t.id && isSameWeek(x.date, today)).length,
                            month: rt.filter(x => x.assignedTo === t.id && String(x.date).slice(0, 7) === today.slice(0, 7)).length,
                            term: rt.filter(x => x.assignedTo === t.id).length
                        }));
                        return (
                            <div id="printable-report" className="hidden print-only">
                                <div className="p-8" style={{ fontFamily: "'Sarabun', 'TH Sarabun New', sans-serif" }}>
                                    <div className="text-center border-b-2 border-slate-800 pb-3 mb-5">
                                        {sysConfig.logoUrl ? <img src={sysConfig.logoUrl} alt="" className="h-16 mx-auto mb-2 object-contain" /> : null}
                                        <h1 className="text-xl font-bold">{sysConfig.name}</h1>
                                        <h2 className="text-base font-semibold">รายงานสรุปการจัดสอนแทน ภาคเรียน {(terms.find(x => x.id === manageTermId) || {}).name || '-'}</h2>
                                        <p className="text-xs">พิมพ์เมื่อ {new Date().toLocaleString('th-TH')}</p>
                                    </div>
                                    <table className="w-full text-sm" style={{ borderCollapse: 'collapse' }}>
                                        <thead>
                                            <tr className="bg-slate-100">
                                                <th className="border border-slate-500 px-2 py-1 text-left">ครู</th>
                                                <th className="border border-slate-500 px-2 py-1 text-left">กลุ่มสาระฯ</th>
                                                <th className="border border-slate-500 px-2 py-1">สัปดาห์นี้</th>
                                                <th className="border border-slate-500 px-2 py-1">เดือนนี้</th>
                                                <th className="border border-slate-500 px-2 py-1">เทอมนี้</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {rows.map(r => (
                                                <tr key={r.t.id} className="print-break-inside-avoid">
                                                    <td className="border border-slate-500 px-2 py-1">{r.t.name}</td>
                                                    <td className="border border-slate-500 px-2 py-1">{r.t.dept || '-'}</td>
                                                    <td className="border border-slate-500 px-2 py-1 text-center">{r.week}</td>
                                                    <td className="border border-slate-500 px-2 py-1 text-center">{r.month}</td>
                                                    <td className="border border-slate-500 px-2 py-1 text-center">{r.term}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="mt-16 text-center text-sm">
                                        <p>ลงชื่อ ..........................................................</p>
                                        <p className="mt-1">({sysConfig.executiveTitle || ''} {sysConfig.executiveName || '..................................'})</p>
                                        <p>ผู้อำนวยการ</p>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* เข้าสู่ระบบ */}
                    {authModal.isOpen && (
                        <div className="fixed inset-0 bg-black/50 z-[80] flex items-center justify-center p-4 no-print" onClick={() => setAuthModal({ isOpen: false, targetTab: '' })}>
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 fade-in" onClick={e => e.stopPropagation()}>
                                <div className="text-center mb-5">
                                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white flex items-center justify-center text-2xl mx-auto mb-3"><i className="fas fa-user-lock"></i></div>
                                    <h3 className="font-bold text-slate-800">เข้าสู่ระบบ</h3>
                                    <p className="text-xs text-slate-400">เข้าสู่ระบบเพื่อใช้งานฟีเจอร์ของครูและผู้ดูแล</p>
                                </div>
                                <div className="space-y-3">
                                    <Field label="บัญชีผู้ใช้">
                                        <select className={inputCls} value={loginId} onChange={e => setLoginId(e.target.value)}>
                                            <option value="">— เลือกบัญชีของท่าน —</option>
                                            <option value="ADMIN">ผู้ดูแลระบบ (วิชาการ)</option>
                                            {teachers.filter(t => t.isActive).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </Field>
                                    {loginId === 'ADMIN' && (
                                        <Field label="รหัสผ่านผู้ดูแลระบบ">
                                            <input type="password" className={inputCls} value={loginPass} onChange={e => setLoginPass(e.target.value)} placeholder="กรอกรหัสผ่าน" onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                                        </Field>
                                    )}
                                    <button onClick={handleLogin} className={btnPrimary + ' w-full justify-center'}><i className="fas fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ตัวแก้ไขคาบสอน */}
                    {slotEditor && (
                        <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4 no-print" onClick={() => setSlotEditor(null)}>
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 fade-in" onClick={e => e.stopPropagation()}>
                                <h3 className="font-bold text-slate-800 mb-1">{slotEditor.slot ? 'แก้ไขคาบสอน' : 'เพิ่มคาบสอน'}</h3>
                                <p className="text-xs text-slate-400 mb-4">{DAYS.find(d => d.id === slotEditor.day)?.name} • คาบ {slotEditor.period} ({getPeriodTime(slotEditor.period)}) • {teachers.find(t => t.id === ttTeacherId)?.name}</p>
                                <div className="space-y-3">
                                    <Field label="รายวิชา">
                                        <select className={inputCls} value={slotForm.subjectId} onChange={e => setSlotForm(f => ({ ...f, subjectId: e.target.value }))}>
                                            <option value="">— เลือกวิชา —</option>
                                            {subjects.filter(s => s.isActive !== false).map(s => <option key={s.id} value={s.id}>{s.code} — {s.name}</option>)}
                                        </select>
                                    </Field>
                                    <Field label="ห้องเรียน">
                                        <select className={inputCls} value={slotForm.roomId} onChange={e => setSlotForm(f => ({ ...f, roomId: e.target.value }))}>
                                            <option value="">— เลือกห้อง —</option>
                                            {rooms.filter(r => r.isActive !== false).map(r => <option key={r.id} value={r.id}>{r.name} ({r.classGroup})</option>)}
                                        </select>
                                    </Field>
                                </div>
                                <div className="flex gap-2 mt-5">
                                    {slotEditor.slot && <button onClick={() => dbActions.delTimetableSlot(scheduleTermId, ttTeacherId, slotEditor.day, slotEditor.period)} className="flex-1 px-4 py-2 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold transition"><i className="fas fa-trash-can mr-1"></i>ลบคาบนี้</button>}
                                    <button onClick={() => setSlotEditor(null)} className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold transition">ยกเลิก</button>
                                    <button onClick={handleSaveSlot} className="flex-1 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition"><i className="fas fa-floppy-disk mr-1"></i>บันทึก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ===== [ฟีเจอร์ 1 + 2] หน้าเลือกครูสอนแทน พร้อมปุ่มดูตารางสอน และข้อมูลภาระแบบใหม่ ===== */}
                    {selectedTask && (() => {
                        const suggested = getSuggestedTeachers(selectedTask);
                        const pr = (sysConfig.autoRules && sysConfig.autoRules.priorities) || DEFAULT_PRIORITIES;
                        const critLabels = { leastLoad: 'ครูที่สอนน้อยที่สุด', matchGrade: 'ตรงระดับชั้น', matchDept: 'ตรงกลุ่มสาระฯ' };
                        const orderText = Object.entries(pr).filter(([, r]) => Number(r) > 0).sort((a, b) => Number(a[1]) - Number(b[1])).map(([k]) => critLabels[k]).join(' → ');
                        return (
                            <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 no-print" onClick={() => setSelectedTask(null)}>
                                <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[92vh] overflow-y-auto custom-scrollbar fade-in" onClick={e => e.stopPropagation()}>
                                    <div className="p-5 border-b border-slate-200 sticky top-0 bg-white z-10 rounded-t-2xl">
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-lg font-bold text-slate-800"><i className="fas fa-user-plus text-indigo-500 mr-2"></i>เลือกครูสอนแทน</h3>
                                            <button onClick={() => setSelectedTask(null)} className="w-9 h-9 rounded-full hover:bg-slate-100 text-slate-500 text-lg"><i className="fas fa-times"></i></button>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                                            <div className="bg-slate-50 rounded-lg p-2"><p className="text-slate-400">วันที่</p><p className="font-bold text-slate-700">{thaiDate(selectedTask.date)}</p></div>
                                            <div className="bg-slate-50 rounded-lg p-2"><p className="text-slate-400">คาบ</p><p className="font-bold text-slate-700">คาบ {selectedTask.period}</p><p className="text-slate-400">{getPeriodTime(selectedTask.period)}</p></div>
                                            <div className="bg-slate-50 rounded-lg p-2"><p className="text-slate-400">วิชา / ชั้น</p><p className="font-bold text-slate-700">{selectedTask.subject}</p><p className="text-slate-400">{selectedTask.classGroup} • ห้อง {selectedTask.room}</p></div>
                                            <div className="bg-slate-50 rounded-lg p-2"><p className="text-slate-400">แทนคาบของ</p><p className="font-bold text-slate-700">{getTeacherName(selectedTask.requesterId)}</p></div>
                                        </div>
                                        <div className="mt-3 text-[11px] text-indigo-600 bg-indigo-50 rounded-lg px-3 py-1.5">
                                            <i className="fas fa-sort-amount-down mr-1"></i>เรียงลำดับครูตาม: <b>{orderText || 'ภาระงาน (ค่าเริ่มต้น)'}</b>
                                        </div>
                                    </div>
                                    <div className="p-5 space-y-3">
                                        {suggested.length === 0 ? (
                                            <EmptyState icon="fa-user-slash" title="ไม่พบครูที่พร้อมสอนแทนในคาบนี้" desc="ลองปรับเงื่อนไขในหน้าตั้งค่าระบบ หรือเลือกครูด้วยตนเองด้านล่าง" />
                                        ) : suggested.map((t, idx) => (
                                            <div key={t.id} className="border border-slate-200 rounded-xl p-4 hover:border-indigo-300 hover:bg-indigo-50/30 transition">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div className="flex items-start gap-3 min-w-0">
                                                        <div className={'w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm shrink-0 ' + (idx === 0 ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400')}>{idx + 1}</div>
                                                        <div className="min-w-0">
                                                            <div className="font-semibold text-slate-800 flex items-center gap-2 flex-wrap">
                                                                {displayName(t)}
                                                                {idx === 0 && !t.overloaded && !t.relaxed && <span className="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 text-[10px] font-bold">แนะนำ</span>}
                                                            </div>
                                                            <div className="text-xs text-slate-400">{t.dept || '-'} • {t.grade || '-'} • เพดาน {t.maxPerDay || sysConfig.defaultMaxPerDay || DEFAULT_MAX_PERIODS} คาบ/วัน</div>
                                                            <div className="flex flex-wrap gap-1 mt-1.5">
                                                                {t.matchDeptFlag && <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200"><i className="fas fa-check mr-0.5"></i>ตรงกลุ่มสาระฯ</span>}
                                                                {t.matchGradeFlag && <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-teal-50 text-teal-600 border border-teal-200"><i className="fas fa-check mr-0.5"></i>ตรงระดับชั้น</span>}
                                                                {t.hasReservation && <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-sky-50 text-sky-600 border border-sky-200"><i className="fas fa-hand-pointer mr-0.5"></i>จองคาบนี้ไว้</span>}
                                                                {t.relaxed && <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-50 text-amber-600 border border-amber-200"><i className="fas fa-triangle-exclamation mr-0.5"></i>ไม่ตรงเงื่อนไขบังคับ</span>}
                                                                {t.overloaded && <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-rose-50 text-rose-600 border border-rose-200"><i className="fas fa-triangle-exclamation mr-0.5"></i>เกินเพดานภาระ/วัน</span>}
                                                            </div>
                                                            <div className="mt-2.5">{renderLoadInfo(t, selectedTask.date)}</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex flex-col gap-2 shrink-0">
                                                        {/* [ฟีเจอร์ 1] ปุ่มคลิกเพื่อดูตารางสอนของครูท่านนั้น */}
                                                        <button type="button" onClick={() => setViewTimetableTeacher(t)} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-semibold transition" title="ดูตารางสอนประจำสัปดาห์ของครูท่านนี้">
                                                            <i className="far fa-calendar-alt"></i> ดูตารางสอน
                                                        </button>
                                                        <button type="button" onClick={() => handleManualAssign(selectedTask, t.id)} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold transition">
                                                            <i className="fas fa-check"></i> เลือกครูท่านนี้
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {isAdmin && (
                                            <div className="border-t border-dashed border-slate-200 pt-4 mt-2">
                                                <div className="flex items-end gap-2">
                                                    <div className="flex-1">
                                                        <Field label="เลือกครูด้วยตนเอง (ข้ามเงื่อนไขการคัดเลือก)">
                                                            <select className={inputCls} value={overrideTeacherId} onChange={e => setOverrideTeacherId(e.target.value)}>
                                                                <option value="">— เลือกครู —</option>
                                                                {activeTeachers.filter(x => x.role === 'teacher').map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
                                                            </select>
                                                        </Field>
                                                    </div>
                                                    <button disabled={!overrideTeacherId} onClick={() => handleManualAssign(selectedTask, overrideTeacherId)} className={btnPrimary + ' disabled:opacity-40'}><i className="fas fa-paper-plane"></i> มอบหมาย</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* รายละเอียดครู (จากหน้ารายงาน/ข้อมูลพื้นฐาน) */}
                    {viewTeacherDetails && (() => {
                        const t = viewTeacherDetails;
                        const totalSlots = Object.values((timetables[currentTermId] || {})[t.id] || {}).reduce((s, arr) => s + arr.length, 0);
                        return (
                            <div className="fixed inset-0 bg-black/50 z-[65] flex items-center justify-center p-4 no-print" onClick={() => setViewTeacherDetails(null)}>
                                <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full max-h-[92vh] overflow-y-auto custom-scrollbar fade-in" onClick={e => e.stopPropagation()}>
                                    <div className="p-5 border-b border-slate-200 flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className="w-11 h-11 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg"><i className="fas fa-user"></i></div>
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-800">{t.name}</h3>
                                                <p className="text-xs text-slate-400">{t.dept || '-'} • {t.grade || '-'} • รวม {totalSlots} คาบ/สัปดาห์ • เพดาน {t.maxPerDay || '-'} คาบ/วัน</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setViewTeacherDetails(null)} className="w-9 h-9 rounded-full hover:bg-slate-100 text-slate-500 text-lg"><i className="fas fa-times"></i></button>
                                    </div>
                                    <div className="p-5 space-y-4">
                                        <div className="bg-slate-50 rounded-xl p-4">{renderLoadInfo(t, getTodayLocalStr())}</div>
                                        {renderTimetableGrid(t.id, currentTermId, { editable: false, highlight: null })}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ===== [ฟีเจอร์ 1] หน้าต่างตารางสอนของครู (เปิดจากปุ่ม "ดูตารางสอน") ===== */}
                    {viewTimetableTeacher && (() => {
                        const t = viewTimetableTeacher;
                        const totalSlots = Object.values((timetables[currentTermId] || {})[t.id] || {}).reduce((s, arr) => s + arr.length, 0);
                        return (
                            <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4 no-print" onClick={() => setViewTimetableTeacher(null)}>
                                <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full max-h-[92vh] overflow-y-auto custom-scrollbar fade-in" onClick={e => e.stopPropagation()}>
                                    <div className="p-5 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white z-10 rounded-t-2xl">
                                        <div className="flex items-center gap-3">
                                            <div className="w-11 h-11 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg"><i className="fas fa-user"></i></div>
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-800">ตารางสอนประจำสัปดาห์ — {displayName(t)}</h3>
                                                <p className="text-xs text-slate-400">{t.dept || '-'} • {t.grade || '-'} • ภาคเรียน {terms.find(x => x.id === currentTermId)?.name || '-'} • รวม {totalSlots} คาบ/สัปดาห์</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setViewTimetableTeacher(null)} className="w-9 h-9 rounded-full hover:bg-slate-100 text-slate-500 text-lg"><i className="fas fa-times"></i></button>
                                    </div>
                                    <div className="p-5">
                                        {selectedTask && (
                                            <div className="mb-4 text-xs bg-amber-50 border border-amber-200 text-amber-700 rounded-lg px-3 py-2">
                                                <i className="fas fa-circle-info mr-1"></i>กรอบสีเหลือง = คาบที่ต้องการจัดสอนแทน (คาบ {selectedTask.period} • {thaiDay(selectedTask.date)}ที่ {thaiDate(selectedTask.date)}) — ช่องว่างตรงนั้นแปลว่าครูท่านนี้ "ว่าง" ในคาบดังกล่าว
                                            </div>
                                        )}
                                        {renderTimetableGrid(t.id, currentTermId, { editable: false, highlight: selectedTask ? { day: new Date(selectedTask.date).getDay(), period: selectedTask.period } : null })}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
