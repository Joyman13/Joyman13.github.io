                                        <td className="px-3 py-3 text-right"><button onClick={()=>openEdit(row)} className="text-blue-500 hover:text-blue-700 mr-3"><i className="fas fa-edit"></i></button><button onClick={()=>onDelete(row.id)} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button></td>
                                    </tr>
                                ))}
                                {processedData.length === 0 && <tr><td colSpan="9" className="px-4 py-6 text-center text-gray-400">ไม่มีข้อมูล</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const TermCrud = ({ data, onSave, onToggle, onDelete, onSetCurrent }) => {
            const [editItem, setEditItem] = useState({});
            const [isEditing, setIsEditing] = useState(false);
            const handleSave = (e) => { e.preventDefault(); onSave(editItem); setIsEditing(false); setEditItem({}); };
            return (
                <div>
                    <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-bold text-gray-800">จัดการภาคเรียน / ปีการศึกษา</h2><button onClick={()=>{setEditItem({}); setIsEditing(true);}} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium"><i className="fas fa-plus mr-2"></i>เพิ่มภาคเรียน</button></div>
                    {isEditing && (
                        <form onSubmit={handleSave} className="bg-gray-50 p-4 rounded-lg border mb-6 flex gap-4 items-end">
                            <div className="flex-1"><label className="block text-xs font-medium text-gray-700 mb-1">ชื่อภาคเรียน (เช่น 1/2569)</label><input required type="text" className="w-full border rounded-md p-2 text-sm" value={editItem.name || ''} onChange={e => setEditItem({...editItem, name: e.target.value})} /></div>
                            <button type="submit" className="bg-green-600 text-white px-4 py-2 rounded-md text-sm">บันทึก</button><button type="button" onClick={()=>setIsEditing(false)} className="bg-gray-200 px-4 py-2 rounded-md text-sm">ยกเลิก</button>
                        </form>
                    )}
                    <div className="overflow-x-auto border rounded-lg"><table className="min-w-full divide-y divide-gray-200"><thead className="bg-gray-100"><tr><th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ชื่อภาคเรียน</th><th className="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase">ปัจจุบัน?</th><th className="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase">ใช้งาน</th><th className="px-4 py-3 text-right text-xs font-semibold text-gray-600 uppercase">จัดการ</th></tr></thead><tbody className="divide-y divide-gray-200 bg-white">
                        {data.map(row => (
                            <tr key={row.id} className={!row.isActive ? 'bg-gray-50 opacity-60' : ''}>
                                <td className="px-4 py-3 text-sm font-medium">{row.name}</td>
                                <td className="px-4 py-3 text-center">{row.isCurrent ? <span className="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full">เทอมปัจจุบัน</span> : <button onClick={() => onSetCurrent(row.id)} className="text-xs text-gray-500 border rounded px-2 py-1 hover:bg-indigo-50 hover:text-indigo-600">ตั้งเป็นปัจจุบัน</button>}</td>
                                <td className="px-4 py-3 text-center"><ToggleSwitch checked={row.isActive} onChange={() => onToggle(row.id)} /></td>
                                <td className="px-4 py-3 text-right"><button onClick={()=>{setEditItem(row); setIsEditing(true);}} className="text-blue-500 hover:text-blue-700 mr-3"><i className="fas fa-edit"></i></button><button onClick={()=>onDelete(row.id)} disabled={row.isCurrent} className="disabled:text-gray-300 text-red-500"><i className="fas fa-trash"></i></button></td>
                            </tr>
                        ))}
                    </tbody></table></div>
                </div>
            );
        };

        const SimpleCrud = ({ title, data, columns, onSave, onToggle, onDelete, showBulkDelete, onDeleteBulk, askConfirm, bulkActionsSlot }) => {
            const [editItem, setEditItem] = useState({ isNew: true });
            const [isEditing, setIsEditing] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);
            
            // Search and Sort
            const [searchTerm, setSearchTerm] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'asc' });

            const processedData = useMemo(() => {
                let filtered = data;
                if (searchTerm) {
                    const lower = searchTerm.toLowerCase();
                    filtered = data.filter(item => 
                        columns.some(col => String(item[col.key] || '').toLowerCase().includes(lower))
                    );
                }
                if (sortConfig.key) {
                    filtered.sort((a, b) => {
                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];
                        if (typeof aVal === 'number' && typeof bVal === 'number') return sortConfig.direction === 'asc' ? aVal - bVal : bVal - aVal;
                        aVal = String(aVal || '').toLowerCase();
                        bVal = String(bVal || '').toLowerCase();
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return filtered;
            }, [data, searchTerm, sortConfig, columns]);

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const handleSave = (e) => { 
                e.preventDefault(); 
                const { isNew, ...itemToSave } = editItem;
                if (!itemToSave.id) itemToSave.id = 'ID' + Date.now().toString().slice(-4);
                onSave(itemToSave); 
                setIsEditing(false); setEditItem({ isNew: true }); 
            };

            const handleSelectAll = (e) => {
                if (e.target.checked) setSelectedIds(processedData.map(d => d.id));
                else setSelectedIds([]);
            };
            const toggleSelect = (id) => {
                if (selectedIds.includes(id)) setSelectedIds(selectedIds.filter(x => x !== id));
                else setSelectedIds([...selectedIds, id]);
            };

            const isAllSelected = processedData.length > 0 && processedData.every(d => selectedIds.includes(d.id));

            return (
                <div>
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 className="text-xl font-bold text-gray-800">{title}</h2>
                        <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            <div className="relative flex-1 md:w-64">
                                <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <input type="text" placeholder="ค้นหา..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-purple-500 outline-none" />
                            </div>
                            {showBulkDelete && selectedIds.length > 0 && (
                                <button onClick={() => { onDeleteBulk(selectedIds); setSelectedIds([]); }} className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-sm font-medium whitespace-nowrap"><i className="fas fa-trash-alt mr-1"></i>ลบ ({selectedIds.length})</button>
                            )}
                            <button onClick={()=>{setEditItem({isNew: true}); setIsEditing(true);}} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm font-medium whitespace-nowrap"><i className="fas fa-plus mr-1"></i>เพิ่มข้อมูล</button>
                        </div>
                    </div>
                    
                    {bulkActionsSlot && bulkActionsSlot(selectedIds, setSelectedIds)}

                    {isEditing && (
                        <form onSubmit={handleSave} className="bg-gray-50 p-4 rounded-lg border mb-6 flex flex-wrap gap-4 items-end">
                            {columns.map(col => (
                                <div key={col.key} className="flex-1 min-w-[150px]">
                                    <label className="block text-xs font-medium text-gray-700 mb-1">{col.label}</label>
                                    {col.type === 'select' ? (
                                        <select required={!col.optional} className="w-full border rounded-md p-2 text-sm" value={editItem[col.key] || ''} onChange={e => setEditItem({...editItem, [col.key]: e.target.value})}><option value="" disabled>-- เลือก --</option>{col.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select>
                                    ) : col.type === 'multiselect' ? (
                                        <div className="flex flex-wrap gap-2 mt-1">
                                            {col.options.map(opt => {
                                                const currentVals = (editItem[col.key] || '').split(',').map(v => v.trim()).filter(Boolean);
                                                const isChecked = currentVals.includes(opt);
                                                return (
                                                    <label key={opt} className="inline-flex items-center bg-white border rounded px-2 py-1 text-sm cursor-pointer hover:bg-gray-50"><input type="checkbox" className="mr-1.5 rounded" checked={isChecked} onChange={(e) => { let newVals = [...currentVals]; if (e.target.checked) newVals.push(opt); else newVals = newVals.filter(v => v !== opt); setEditItem({...editItem, [col.key]: newVals.join(', ')}); }} />{opt}</label>
                                                );
                                            })}
                                        </div>
                                    ) : <input required={!col.optional} disabled={col.key === 'id' && !editItem.isNew} type="text" className={`w-full border rounded-md p-2 text-sm ${(col.key === 'id' && !editItem.isNew) ? 'bg-gray-100 cursor-not-allowed text-gray-500' : 'focus:ring-blue-500'}`} value={editItem[col.key] || ''} onChange={e => setEditItem({...editItem, [col.key]: e.target.value})} />}
                                </div>
                            ))}
                            <div className="flex gap-2 w-full mt-2"><button type="submit" className="bg-green-600 text-white px-4 py-2 rounded-md text-sm flex-1">บันทึก</button><button type="button" onClick={()=>setIsEditing(false)} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm flex-1">ยกเลิก</button></div>
                        </form>
                    )}
                    <div className="overflow-x-auto border rounded-lg max-h-[600px] overflow-y-auto">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-100 sticky top-0 z-10 shadow-sm"><tr>
                                {showBulkDelete && <th className="px-4 py-3 text-center w-10"><input type="checkbox" className="rounded" onChange={handleSelectAll} checked={isAllSelected} /></th>}
                                {columns.map(col => (
                                    <th key={col.key} className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase cursor-pointer hover:bg-gray-200" onClick={() => requestSort(col.key)}>
                                        {col.label} {sortConfig.key === col.key ? <i className={`fas fa-sort-${sortConfig.direction === 'asc' ? 'up' : 'down'} ml-1 text-purple-600`}></i> : <i className="fas fa-sort text-gray-400 ml-1"></i>}
                                    </th>
                                ))}
                                <th className="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase">สถานะ</th><th className="px-4 py-3 text-right text-xs font-semibold text-gray-600 uppercase">จัดการ</th></tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200 bg-white">
                                {processedData.map(row => (
                                    <tr key={row.id} className={!row.isActive ? 'bg-gray-50 opacity-60' : 'hover:bg-gray-50'}>
                                        {showBulkDelete && <td className="px-4 py-3 text-center"><input type="checkbox" className="rounded" checked={selectedIds.includes(row.id)} onChange={()=>toggleSelect(row.id)} /></td>}
                                        {columns.map(col => <td key={col.key} className="px-4 py-3 text-sm">{row[col.key]}</td>)}
                                        <td className="px-4 py-3 text-center"><ToggleSwitch checked={row.isActive} onChange={() => onToggle(row.id)} /></td>
                                        <td className="px-4 py-3 text-right"><button onClick={()=>{setEditItem({...row, isNew: false}); setIsEditing(true);}} className="text-blue-500 hover:text-blue-700 mr-3"><i className="fas fa-edit"></i></button><button onClick={()=>onDelete(row.id)} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button></td>
                                    </tr>
                                ))}
                                {processedData.length === 0 && <tr><td colSpan={columns.length+3} className="px-4 py-6 text-center text-gray-500">ไม่มีข้อมูลที่ค้นหา</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const TeacherCrud = ({ data, depts, grades, onSave, onToggle, onDelete, onAddBulk, onDeleteBulk, sysConfig, showToast, askConfirm }) => {
            const fileInputRef = useRef(null);
            const [bulkMaxPerDay, setBulkMaxPerDay] = useState('');
            const columns = [ {key:'id', label:'รหัสครู'}, {key:'name', label:'ชื่อ-สกุล'}, {key:'dept', label:'กลุ่มสาระ', type:'multiselect', options:depts}, {key:'grade', label:'สอนชั้น', type:'multiselect', options:grades}, {key:'maxPerDay', label:'ลิมิต/วัน', optional: true} ];
            
            const getTemplate = () => {
                const csv = `รหัสครู,ชื่อ-สกุล,กลุ่มสาระ (คั่นด้วยลูกน้ำ),สอนชั้น (คั่นด้วยลูกน้ำ),ลิมิตคาบต่อวัน\nT06,นายทดสอบ ใช้งานดี,"คณิตศาสตร์, วิทยาศาสตร์","ม.1, ม.2",4`;
                downloadCSV('teacher_template.csv', csv);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    const rows = parseCSV(text);
                    if (rows.length < 2) return showToast('ไฟล์ไม่ถูกต้อง หรือไม่มีข้อมูล', 'error');
                    
                    const newTeachers = [];
                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (r.length < 5 || !r[0]) continue;
                        const tId = r[0].trim();
                        newTeachers.push({
                            id: tId,
                            name: r[1].trim(),
                            dept: r[2].trim() || '',
                            grade: r[3].trim() || '',
                            maxPerDay: r[4] ? parseInt(r[4]) : sysConfig.defaultMaxPerDay,
                            role: 'teacher',
                            isActive: true
                        });
                    }
                    if (newTeachers.length > 0) {
                        onAddBulk(newTeachers);
                        showToast(`นำเข้าข้อมูลครูสำเร็จ ${newTeachers.length} รายการ`);
                    } else { showToast('ไม่พบข้อมูลที่สามารถนำเข้าได้', 'error'); }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            // Custom Slot for Bulk Actions
            const BulkEditUI = (selectedIds, setSelectedIds) => {
                const handleBulkUpdateMax = () => {
                    if(!bulkMaxPerDay || isNaN(bulkMaxPerDay)) return showToast('ระบุลิมิต/วันที่ถูกต้อง', 'error');
                    const itemsToUpdate = data.filter(t => selectedIds.includes(t.id)).map(t => ({ ...t, maxPerDay: parseInt(bulkMaxPerDay) }));
                    askConfirm(`ยืนยันอัปเดตลิมิตเป็น ${bulkMaxPerDay} คาบ/วัน สำหรับครู ${itemsToUpdate.length} ท่าน?`, () => {
                        onAddBulk(itemsToUpdate); 
                        setSelectedIds([]);
                        setBulkMaxPerDay('');
                    });
                };
                
                if (selectedIds.length === 0) return null;
                return (
                    <div className="mb-4 p-3 bg-indigo-50 border border-indigo-100 rounded-lg flex flex-wrap items-center gap-3">
                        <span className="text-sm font-semibold text-indigo-800"><i className="fas fa-edit mr-2"></i>แก้ไข {selectedIds.length} รายการที่เลือก:</span>
                        <input type="number" min="1" max="10" placeholder="ลิมิตคาบ/วันใหม่" value={bulkMaxPerDay} onChange={e=>setBulkMaxPerDay(e.target.value)} className="border border-indigo-200 rounded px-2 py-1.5 text-sm w-36 focus:ring-indigo-500 outline-none" />
                        <button onClick={handleBulkUpdateMax} className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm font-medium shadow-sm transition-colors">อัปเดตลิมิต</button>
                    </div>
                );
            };

            return (
                <div>
                    <div className="mb-4 flex flex-wrap gap-2 justify-end">
                        <button onClick={getTemplate} className="bg-gray-200 text-gray-700 px-3 py-1.5 rounded text-sm hover:bg-gray-300"><i className="fas fa-download mr-1"></i> โหลดแม่แบบ CSV</button>
                        <button onClick={() => fileInputRef.current.click()} className="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded text-sm hover:bg-indigo-200"><i className="fas fa-upload mr-1"></i> นำเข้า CSV (UTF-8)</button>
                        <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={handleFileUpload} />
                    </div>
                    <SimpleCrud 
                        title="จัดการข้อมูลครูผู้สอน" 
                        data={data.filter(t=>t.role!=='admin')} 
                        columns={columns} 
                        onSave={i => onSave({...i, role: 'teacher', maxPerDay: i.maxPerDay ? parseInt(i.maxPerDay) : sysConfig.defaultMaxPerDay})} 
                        onToggle={onToggle} 
                        onDelete={onDelete} 
                        showBulkDelete={true} 
                        onDeleteBulk={onDeleteBulk} 
                        askConfirm={askConfirm} 
                        bulkActionsSlot={BulkEditUI} 
                    />
                </div>
            );
        };

        const TimetableManager = ({ manageTermId, termName, teachers, departments, timetables, subjects, allSubjects, rooms, addTimetableSlot, delTimetableSlot, onAddBulk, onDeleteBulk, showToast, askConfirm }) => {
            // วิชาที่ใช้ได้กับภาคเรียนที่กำลังจัดตาราง (กรองตาม termId ของวิชา ถ้าวิชาไม่ได้ระบุ = ใช้ได้ทุกเทอม)
            const termSubjects = useMemo(() => subjects.filter(s => {
                if (!s.termId) return true;
                return s.termId.split(',').map(v=>v.trim()).includes(manageTermId);
            }), [subjects, manageTermId]);
            const [viewMode, setViewMode] = useState('grid'); 
            const [selDept, setSelDept] = useState('');
            const [selTeacher, setSelTeacher] = useState(''); 
            const [selDay, setSelDay] = useState(1);
            const [addCell, setAddCell] = useState(null); // { day, period, roomId } currently open for adding in grid mode

            const filteredTeachersByDept = useMemo(() => {
                if (!selDept) return [];
                return teachers.filter(t => (t.dept || '').split(',').map(x => x.trim()).includes(selDept));
            }, [teachers, selDept]);
            
            // Search and Sort State for List View
            const [searchTerm, setSearchTerm] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'day', direction: 'asc' });
            
            const [selectedSlots, setSelectedSlots] = useState([]);
            const fileInputRef = useRef(null);
            
            const schedule = selTeacher ? [...(timetables[manageTermId]?.[selTeacher]?.[selDay] || [])].sort((a,b)=>parseInt(a.period)-parseInt(b.period)) : [];

            // 1. Raw Extracted Data
            const allTimetables = useMemo(() => {
                let all = [];
                const termTt = timetables[manageTermId] || {};
                Object.keys(termTt).forEach(tId => {
                    const teacherName = teachers.find(x=>x.id === tId)?.name || tId;
                    Object.keys(termTt[tId]).forEach(day => {
                        const dayName = DAYS.find(d=>d.id === parseInt(day))?.name || day;
                        termTt[tId][day].forEach(slot => {
                            all.push({ ...slot, teacherId: tId, teacherName, day: parseInt(day), dayName, uniqueId: `${tId}-${day}-${slot.period}` });
                        });
                    });
                });
                return all;
            }, [timetables, manageTermId, teachers]);

            // 2. Processed Data (Searched & Sorted)
            const processedTimetables = useMemo(() => {
                let filtered = allTimetables.filter(item => {
                    if (!searchTerm) return true;
                    const s = searchTerm.toLowerCase();
                    return (
                        item.teacherName.toLowerCase().includes(s) ||
                        item.subject.toLowerCase().includes(s) ||
                        item.classGroup.toLowerCase().includes(s) ||
                        item.room.toLowerCase().includes(s) ||
                        item.dayName.toLowerCase().includes(s)
                    );
                });

                if (sortConfig.key) {
                    filtered.sort((a, b) => {
                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];
                        
                        if (sortConfig.key === 'day' || sortConfig.key === 'period') {
                            aVal = parseInt(aVal);
                            bVal = parseInt(bVal);
                            if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                            if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                            return 0;
                        }

                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return filtered;
            }, [allTimetables, searchTerm, sortConfig]);

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const addSlot = (e) => {
                e.preventDefault(); const fd = new FormData(e.target);
                const period = fd.get('period'); const subjId = fd.get('subject'); const roomId = fd.get('room');
                if(schedule.some(s=>s.period === period)) return showToast('คาบนี้มีสอนแล้ว กรุณาลบของเดิมก่อน', 'error');
                const subjObj = subjects.find(s=>s.id === subjId); const roomObj = rooms.find(r=>r.id === roomId);
                const slotData = { period, subjectId: subjId, roomId: roomId, subject: subjObj.name, targetDept: subjObj.dept, targetGrade: roomObj.grade, classGroup: roomObj.classGroup, room: roomObj.name };
                addTimetableSlot(manageTermId, selTeacher, selDay, slotData); e.target.reset();
            };

            const addSlotInGrid = (day, period, roomId, subjectId) => {
                const daySlots = (timetables[manageTermId]?.[selTeacher]?.[day]) || [];
                if (daySlots.some(s => s.period === period)) { showToast('คาบนี้มีสอนแล้ว กรุณาลบของเดิมก่อน', 'error'); setAddCell(null); return; }
                const subjObj = subjects.find(s=>s.id === subjectId); const roomObj = rooms.find(r=>r.id === roomId);
                const slotData = { period, subjectId: subjectId, roomId: roomId, subject: subjObj.name, targetDept: subjObj.dept, targetGrade: roomObj.grade, classGroup: roomObj.classGroup, room: roomObj.name };
                addTimetableSlot(manageTermId, selTeacher, day, slotData);
                setAddCell(null);
            };

            const delSlot = (period) => {
                delTimetableSlot(manageTermId, selTeacher, selDay, period);
            };

            const getTemplate = () => {
                const csv = `รหัสครู,วันที่สอน(1=จันทร์ 5=ศุกร์),คาบที่,รหัสวิชาระบบ,รหัสห้องระบบ\nT01,1,1,S01,R01\nT01,1,2,S02,R02`;
                downloadCSV('timetable_template.csv', csv);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    const rows = parseCSV(text);
                    if (rows.length < 2) return showToast('ไฟล์ไม่ถูกต้อง หรือไม่มีข้อมูล', 'error');
                    
                    const newSlots = [];
                    let errorLog = [];
                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (r.length < 5 || !r[0]) continue;
                        const tId = r[0].trim();
                        const day = parseInt(r[1]);
                        const period = r[2].trim();
                        const subjId = r[3].trim();
                        const roomId = r[4].trim();

                        const subjObj = subjects.find(s=>s.id === subjId);
                        const roomObj = rooms.find(room=>room.id === roomId);
                        const teacherObj = teachers.find(t=>t.id === tId);

                        if (!subjObj) errorLog.push(`บรรทัด ${i+1}: ไม่พบรหัสวิชา ${subjId}`);
                        else if (!roomObj) errorLog.push(`บรรทัด ${i+1}: ไม่พบรหัสห้อง ${roomId}`);
                        else if (!teacherObj) errorLog.push(`บรรทัด ${i+1}: ไม่พบรหัสครู ${tId}`);
                        else if (day < 1 || day > 5) errorLog.push(`บรรทัด ${i+1}: วันที่สอนไม่ถูกต้อง (${day})`);
                        else {
                            newSlots.push({ teacherId: tId, day: day, data: { period, subjectId: subjId, roomId: roomId, subject: subjObj.name, targetDept: subjObj.dept, targetGrade: roomObj.grade, classGroup: roomObj.classGroup, room: roomObj.name } });
                        }
                    }
                    if (newSlots.length > 0) {
                        onAddBulk(manageTermId, newSlots);
                        showToast(`นำเข้าสำเร็จ ${newSlots.length} คาบ`);
                        if (errorLog.length > 0) console.warn("Errors during import:", errorLog);
                    } else {
                        showToast('ไม่พบข้อมูลที่นำเข้าได้', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const handleSelectAll = (e) => {
                if (e.target.checked) setSelectedSlots(processedTimetables);
                else setSelectedSlots([]);
            };

            const toggleSelectSlot = (slot) => {
                if (selectedSlots.some(s => s.uniqueId === slot.uniqueId)) setSelectedSlots(selectedSlots.filter(s => s.uniqueId !== slot.uniqueId));
                else setSelectedSlots([...selectedSlots, slot]);
            };

            return (
                <div>
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">จัดการตารางสอน <span className="bg-indigo-100 text-indigo-800 text-sm px-3 py-1 rounded-full">เทอม: {termName}</span></h2>
                        <div className="flex gap-2">
                            <button onClick={getTemplate} className="bg-gray-200 text-gray-700 px-3 py-1.5 rounded text-sm hover:bg-gray-300"><i className="fas fa-download mr-1"></i> โหลดแม่แบบ CSV</button>
                            <button onClick={() => fileInputRef.current.click()} className="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded text-sm hover:bg-indigo-200"><i className="fas fa-upload mr-1"></i> นำเข้า CSV</button>
                            <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={handleFileUpload} />
                        </div>
                    </div>

                    <div className="flex gap-2 mb-4 border-b pb-2 flex-wrap">
                        <button onClick={()=>setViewMode('grid')} className={`px-4 py-2 text-sm font-medium rounded-t-lg ${viewMode==='grid' ? 'bg-white border-t border-l border-r border-gray-200 text-purple-700 -mb-[9px]' : 'text-gray-500 hover:bg-gray-100'}`}><i className="fas fa-table mr-1"></i>ตารางสอนจริง (รายสัปดาห์)</button>
                        <button onClick={()=>setViewMode('individual')} className={`px-4 py-2 text-sm font-medium rounded-t-lg ${viewMode==='individual' ? 'bg-white border-t border-l border-r border-gray-200 text-purple-700 -mb-[9px]' : 'text-gray-500 hover:bg-gray-100'}`}>เพิ่ม/ลบ รายวัน (เร็ว)</button>
                        <button onClick={()=>setViewMode('list')} className={`px-4 py-2 text-sm font-medium rounded-t-lg ${viewMode==='list' ? 'bg-white border-t border-l border-r border-gray-200 text-purple-700 -mb-[9px]' : 'text-gray-500 hover:bg-gray-100'}`}>มุมมองตารางรวม (ลบหลายรายการ)</button>
                    </div>

                    {viewMode === 'grid' && (
                        <div className="pt-2">
                            <div className="flex flex-col sm:flex-row gap-3 mb-6">
                                <div className="flex-1">
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">1. เลือกกลุ่มสาระฯ</label>
                                    <select className="border rounded-lg p-2 w-full" value={selDept} onChange={e=>{ setSelDept(e.target.value); setSelTeacher(''); setAddCell(null); }}>
                                        <option value="">-- เลือกกลุ่มสาระฯ --</option>
                                        {departments.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}
                                    </select>
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">2. เลือกครูผู้สอน</label>
                                    <select className="border rounded-lg p-2 w-full disabled:bg-gray-100" disabled={!selDept} value={selTeacher} onChange={e=>{setSelTeacher(e.target.value); setAddCell(null);}}>
                                        <option value="">{selDept ? '-- เลือกครูผู้สอนเพื่อจัดตารางจริง --' : 'กรุณาเลือกกลุ่มสาระฯก่อน'}</option>
                                        {filteredTeachersByDept.map(t=><option key={t.id} value={t.id}>{t.name} ({t.id})</option>)}
                                    </select>
                                </div>
                            </div>
                            {selTeacher ? (
                                <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
                                    <div className="p-4 bg-purple-50 border-b font-semibold text-purple-800 flex items-center justify-between flex-wrap gap-2">
                                        <span>ตารางสอนจริงทั้งสัปดาห์: {teachers.find(t=>t.id===selTeacher)?.name}</span>
                                        <span className="text-xs font-normal text-purple-600"><i className="fas fa-info-circle mr-1"></i>คลิกที่ช่องว่างเพื่อเพิ่มคาบ คลิก <i className="fas fa-times text-red-400"></i> เพื่อลบ</span>
                                    </div>
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="min-w-full border-collapse">
                                            <thead>
                                                <tr className="bg-gray-100">
                                                    <th className="border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-600 w-28">คาบ / เวลา</th>
                                                    {DAYS.map(d => <th key={d.id} className="border border-gray-200 px-3 py-2 text-sm font-semibold text-gray-700 min-w-[160px]">วัน{d.name}</th>)}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {PERIOD_TIMES.map(pt => (
                                                    <tr key={pt.period}>
                                                        <td className="border border-gray-200 px-3 py-2 bg-gray-50 text-center">
                                                            <div className="font-bold text-indigo-600">คาบ {pt.period}</div>
                                                            <div className="text-[11px] text-gray-400">{pt.time}</div>
                                                        </td>
                                                        {DAYS.map(d => {
                                                            const daySlots = (timetables[manageTermId]?.[selTeacher]?.[d.id]) || [];
                                                            const slot = daySlots.find(s => s.period === pt.period);
                                                            const isAdding = addCell && addCell.day === d.id && addCell.period === pt.period;
                                                            return (
                                                                <td key={d.id} className="border border-gray-200 p-1 align-top">
                                                                    {slot ? (
                                                                        <div className="relative bg-indigo-50 border border-indigo-200 rounded-lg p-2 h-full min-h-[64px]">
                                                                            <button onClick={() => delTimetableSlot(manageTermId, selTeacher, d.id, slot.period)} className="absolute top-1 right-1 text-red-400 hover:text-red-600 p-1" title="ลบคาบนี้"><i className="fas fa-times"></i></button>
                                                                            <div className="font-medium text-sm text-gray-800 pr-4 truncate">{slot.subject}</div>
                                                                            <div className="text-xs text-gray-500 mt-1"><span className="bg-indigo-100 px-1 rounded text-indigo-700 mr-1">{slot.classGroup}</span>{slot.room}</div>
                                                                        </div>
                                                                    ) : isAdding ? (
                                                                        <div className="bg-yellow-50 border border-yellow-300 rounded-lg p-2 space-y-1.5 min-h-[64px]">
                                                                            {!addCell.roomId ? (
                                                                                <React.Fragment>
                                                                                    <div className="text-[10px] text-gray-500 font-semibold">1. เลือกห้อง</div>
                                                                                    <select autoFocus className="w-full border rounded p-1 text-xs" defaultValue="" onChange={(e)=>{ if(e.target.value) setAddCell({...addCell, roomId: e.target.value}); }}>
                                                                                        <option value="">-- ห้อง --</option>
                                                                                        {rooms.map(r=><option key={r.id} value={r.id}>{r.name} ({r.classGroup})</option>)}
                                                                                    </select>
                                                                                    <button type="button" onClick={()=>setAddCell(null)} className="w-full bg-gray-200 text-xs py-1 rounded hover:bg-gray-300">ยกเลิก</button>
                                                                                </React.Fragment>
                                                                            ) : (() => {
                                                                                const roomObj = rooms.find(r=>r.id===addCell.roomId);
                                                                                const filteredSubjects = termSubjects.filter(s=>s.grade === roomObj.grade);
                                                                                return (
                                                                                    <React.Fragment>
                                                                                        <div className="text-[10px] text-gray-500 font-semibold">2. เลือกวิชา (ชั้น {roomObj.grade})</div>
                                                                                        <select autoFocus className="w-full border rounded p-1 text-xs" defaultValue="" onChange={(e)=>{ if(e.target.value) addSlotInGrid(d.id, pt.period, addCell.roomId, e.target.value); }}>
                                                                                            <option value="">-- วิชา --</option>
                                                                                            {filteredSubjects.map(s=><option key={s.id} value={s.id}>{s.code} {s.name}</option>)}
                                                                                        </select>
                                                                                        {filteredSubjects.length === 0 && <div className="text-[10px] text-red-500">ไม่มีรายวิชาของชั้นนี้</div>}
                                                                                        <div className="flex gap-1">
                                                                                            <button type="button" onClick={()=>setAddCell({...addCell, roomId: ''})} className="flex-1 bg-gray-100 text-xs py-1 rounded hover:bg-gray-200">ย้อนกลับ</button>
                                                                                            <button type="button" onClick={()=>setAddCell(null)} className="flex-1 bg-gray-200 text-xs py-1 rounded hover:bg-gray-300">ยกเลิก</button>
                                                                                        </div>
                                                                                    </React.Fragment>
                                                                                );
                                                                            })()}
                                                                        </div>
                                                                    ) : (
                                                                        <button onClick={() => setAddCell({ day: d.id, period: pt.period, roomId: '' })} className="w-full h-full min-h-[64px] flex items-center justify-center text-gray-300 hover:text-purple-500 hover:bg-purple-50 rounded-lg transition-colors">
                                                                            <i className="fas fa-plus"></i>
                                                                        </button>
                                                                    )}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ) : <div className="text-center py-10 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-gray-500">กรุณาเลือกครูผู้สอนเพื่อดูและจัดตารางสอนจริงทั้งสัปดาห์</div>}
                        </div>
                    )}

                    {viewMode === 'individual' && (
                        <div className="pt-2">
                            <div className="flex flex-wrap gap-4 mb-6">
                                <select className="border rounded-lg p-2 w-full sm:w-1/3" value={selDept} onChange={e=>{ setSelDept(e.target.value); setSelTeacher(''); }}><option value="">-- เลือกกลุ่มสาระฯ --</option>{departments.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}</select>
                                <select className="border rounded-lg p-2 w-full sm:w-1/3 disabled:bg-gray-100" disabled={!selDept} value={selTeacher} onChange={e=>setSelTeacher(e.target.value)}><option value="">{selDept ? '-- เลือกครูผู้สอน --' : 'กรุณาเลือกกลุ่มสาระฯก่อน'}</option>{filteredTeachersByDept.map(t=><option key={t.id} value={t.id}>{t.name} ({t.id})</option>)}</select>
                                <select className="border rounded-lg p-2 w-full sm:w-1/4" value={selDay} onChange={e=>setSelDay(parseInt(e.target.value))}>{DAYS.map(d=><option key={d.id} value={d.id}>วัน{d.name}</option>)}</select>
                            </div>
                            {selTeacher ? (
                                <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
                                    <div className="p-4 bg-purple-50 border-b font-semibold text-purple-800">ตารางสอน: {teachers.find(t=>t.id===selTeacher)?.name} | วัน{DAYS.find(d=>d.id===selDay).name}</div>
                                    <div className="p-4">
                                        <form onSubmit={addSlot} className="flex gap-3 mb-6 items-end bg-gray-50 p-4 rounded border"><div className="w-20"><label className="block text-xs mb-1">คาบที่</label><select name="period" required className="border p-2 rounded w-full"><option value="">-</option>{[1,2,3,4,5,6,7,8,9].map(p=><option key={p} value={p}>{p}</option>)}</select></div><div className="flex-1"><label className="block text-xs mb-1">วิชา (ภาคเรียน: {termName})</label><select name="subject" required className="border p-2 rounded w-full"><option value="">-- เลือก --</option>{termSubjects.map(s=><option key={s.id} value={s.id}>{s.code} {s.name}</option>)}</select></div><div className="flex-1"><label className="block text-xs mb-1">ห้อง</label><select name="room" required className="border p-2 rounded w-full"><option value="">-- เลือก --</option>{rooms.map(r=><option key={r.id} value={r.id}>{r.name} ({r.classGroup})</option>)}</select></div><button type="submit" className="bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700">เพิ่มคาบ</button></form>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            {schedule.map(s => (<div key={s.period} className="relative bg-white border border-indigo-200 rounded-lg p-3 shadow-sm"><button onClick={()=> delSlot(s.period)} className="absolute top-2 right-2 text-red-400 hover:text-red-600 p-1"><i className="fas fa-times"></i></button><div className="font-bold text-indigo-600 text-lg">คาบ {s.period}</div><div className="font-medium text-sm text-gray-800 truncate">{s.subject}</div><div className="text-xs text-gray-500 mt-1"><span className="bg-indigo-100 px-1 rounded text-indigo-700 mr-1">{s.classGroup}</span> {s.room}</div></div>))}
                                        </div>
                                    </div>
                                </div>
                            ) : <div className="text-center py-10 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-gray-500">กรุณาเลือกครูผู้สอนเพื่อจัดการตาราง</div>}
                        </div>
                    )}

                    {viewMode === 'list' && (
                        <div className="pt-2">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                {selectedSlots.length > 0 ? (
                                    <button onClick={() => { onDeleteBulk(manageTermId, selectedSlots); setSelectedSlots([]); }} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm"><i className="fas fa-trash-alt mr-2"></i>ลบที่เลือก ({selectedSlots.length})</button>
                                ) : <div className="hidden sm:block"></div>}
                                
                                <div className="relative w-full sm:w-64">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-search text-gray-400"></i></div>
                                    <input type="text" className="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-purple-500 shadow-sm" placeholder="ค้นหาครู, วิชา, ห้อง..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                </div>
                            </div>
                            
                            <div className="overflow-x-auto border rounded-lg max-h-[600px] overflow-y-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-100 sticky top-0 z-10 shadow-sm">
                                        <tr>
                                            <th className="px-4 py-3 text-center w-10"><input type="checkbox" className="rounded" onChange={handleSelectAll} checked={processedTimetables.length > 0 && selectedSlots.length === processedTimetables.length} /></th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase cursor-pointer hover:bg-gray-200" onClick={() => requestSort('day')}>
                                                วัน {sortConfig.key === 'day' ? <i className={`fas fa-sort-${sortConfig.direction === 'asc' ? 'up' : 'down'} ml-1 text-purple-600`}></i> : <i className="fas fa-sort text-gray-400 ml-1"></i>}
                                            </th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase cursor-pointer hover:bg-gray-200" onClick={() => requestSort('period')}>
                                                คาบ {sortConfig.key === 'period' ? <i className={`fas fa-sort-${sortConfig.direction === 'asc' ? 'up' : 'down'} ml-1 text-purple-600`}></i> : <i className="fas fa-sort text-gray-400 ml-1"></i>}
                                            </th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase cursor-pointer hover:bg-gray-200" onClick={() => requestSort('teacherName')}>
                                                ครูผู้สอน {sortConfig.key === 'teacherName' ? <i className={`fas fa-sort-${sortConfig.direction === 'asc' ? 'up' : 'down'} ml-1 text-purple-600`}></i> : <i className="fas fa-sort text-gray-400 ml-1"></i>}
                                            </th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase cursor-pointer hover:bg-gray-200" onClick={() => requestSort('subject')}>
                                                วิชา / ห้อง {sortConfig.key === 'subject' ? <i className={`fas fa-sort-${sortConfig.direction === 'asc' ? 'up' : 'down'} ml-1 text-purple-600`}></i> : <i className="fas fa-sort text-gray-400 ml-1"></i>}
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200 bg-white">
                                        {processedTimetables.map(row => (
                                            <tr key={row.uniqueId} className="hover:bg-gray-50">
                                                <td className="px-4 py-3 text-center"><input type="checkbox" className="rounded" checked={selectedSlots.some(s=>s.uniqueId === row.uniqueId)} onChange={()=>toggleSelectSlot(row)} /></td>
                                                <td className="px-4 py-3 text-sm text-gray-900">{row.dayName}</td>
                                                <td className="px-4 py-3 text-sm font-bold text-indigo-600">{row.period}</td>
                                                <td className="px-4 py-3 text-sm text-gray-900">{row.teacherName}</td>
                                                <td className="px-4 py-3 text-sm text-gray-900">{row.subject} <span className="bg-gray-100 px-2 py-0.5 rounded text-xs text-gray-600 ml-2">{row.classGroup}</span></td>
                                            </tr>
                                        ))}
                                        {processedTimetables.length === 0 && <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-500">ไม่มีข้อมูลที่ค้นหา</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
