<!DOCTYPE html>
<html lang="th"> 
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดสอนแทน</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
        Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
    </script>

    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #printable-report { margin: 0; padding: 0; box-shadow: none; border: none; }
            .print-break-inside-avoid { break-inside: avoid; }
            input.print-input { border: none !important; background: transparent !important; padding: 0 !important; box-shadow: none !important; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic,env">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // ตั้งค่า Google Apps Script Web App URL ที่นี่
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxB_y03F43tE3UHIqxO4du3hmDeKOInmUEHydIILhMNzccPcCt-folEVOQvgNemg2CZA/exec';

        const DEFAULT_MAX_PERIODS = 4;
        const DAYS = [{id: 1, name: 'จันทร์'}, {id: 2, name: 'อังคาร'}, {id: 3, name: 'พุธ'}, {id: 4, name: 'พฤหัสบดี'}, {id: 5, name: 'ศุกร์'}];
        const PERIOD_TIMES = [
            { period: '1', time: '08.30-09.20' },
            { period: '2', time: '09.20-10.10' },
            { period: '3', time: '10.10-11.00' },
            { period: '4', time: '11.00-11.50' },
            { period: '5', time: '13.00-13.50' },
            { period: '6', time: '13.50-14.40' },
            { period: '7', time: '14.40-15.30' },
            { period: '8', time: '15.30-16.20' }
        ];

        // --- Helper Functions ---
        const getWeekStart = (dateStr) => {
            const d = new Date(dateStr);
            const day = d.getDay() || 7; 
            d.setDate(d.getDate() - day + 1);
            return d.toISOString().split('T')[0];
        };
        const isSameWeek = (d1, d2) => getWeekStart(d1) === getWeekStart(d2);
        const isLastWeek = (d1, current) => {
            const lastWeekDate = new Date(current);
            lastWeekDate.setDate(lastWeekDate.getDate() - 7);
            return isSameWeek(d1, lastWeekDate.toISOString().split('T')[0]);
        };
        const getTodayLocalStr = () => {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };
        const getCurrentWeekStartStr = () => {
            const d = new Date();
            const day = d.getDay() || 7; 
            d.setDate(d.getDate() - day + 1);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };

        const parseCSV = (str) => {
            const result = [];
            let inQuotes = false, curr = '', row = [];
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) { row.push(curr.trim()); curr = ''; } 
                else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && str[i+1] === '\n') i++; 
                    row.push(curr.trim());
                    if (row.join('') !== '') result.push(row);
                    row = []; curr = '';
                } else { curr += char; }
            }
            if (curr !== '' || row.length > 0) { row.push(curr.trim()); result.push(row); }
            return result;
        };

        const downloadCSV = (filename, content) => {
            const blob = new Blob(["\uFEFF" + content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- Mock Data Sets ---
        const MOCK_SYS = { name: 'ระบบจัดสอนแทนอัจฉริยะ', logoUrl: '', password: '1234', defaultMaxPerDay: 4, sheetUrl: '', autoRules: { mustMatchDept: false, mustMatchGrade: false, balanceLoad: true, ignoreMaxLoadIfEmpty: true } };
        const MOCK_TERMS = [{ id: 'TERM_2569_1', name: '1/2569', isCurrent: true, isActive: true }, { id: 'TERM_2569_2', name: '2/2569', isCurrent: false, isActive: true }];
        const MOCK_DEPTS = [{ id: 'D01', name: 'คณิตศาสตร์', isActive: true }, { id: 'D02', name: 'วิทยาศาสตร์', isActive: true }, { id: 'D03', name: 'ภาษาไทย', isActive: true }, { id: 'D04', name: 'ภาษาต่างประเทศ', isActive: true }];
        const MOCK_GRADES = [{ id: 'G01', name: 'ม.1', isActive: true }, { id: 'G02', name: 'ม.2', isActive: true }, { id: 'G03', name: 'ม.3', isActive: true }];
        const MOCK_ROOMS = [{ id: 'R01', name: '111', grade: 'ม.1', classGroup: 'ม.1/1', isActive: true }, { id: 'R02', name: '112', grade: 'ม.1', classGroup: 'ม.1/2', isActive: true }, { id: 'R03', name: '211', grade: 'ม.2', classGroup: 'ม.2/1', isActive: true }, { id: 'R04', name: '311', grade: 'ม.3', classGroup: 'ม.3/1', isActive: true }];
        const MOCK_SUBJS = [
            { id: 'S01', code: 'ค21101', name: 'คณิตศาสตร์พื้นฐาน', dept: 'คณิตศาสตร์', grade: 'ม.1', room: 'ทั้งหมด', isActive: true }, 
            { id: 'S02', code: 'ค21201', name: 'คณิตศาสตร์เพิ่มเติม', dept: 'คณิตศาสตร์', grade: 'ม.1', room: '111, 112', isActive: true },
            { id: 'S03', code: 'ว21101', name: 'วิทยาศาสตร์', dept: 'วิทยาศาสตร์', grade: 'ม.1', room: 'ทั้งหมด', isActive: true }, 
            { id: 'S04', code: 'ท23101', name: 'ภาษาไทย', dept: 'ภาษาไทย', grade: 'ม.3', room: 'ทั้งหมด', isActive: true }
        ];
        const MOCK_TEACHERS = [
            { id: 'ADMIN', name: 'เจ้าหน้าที่วิชาการ', role: 'admin', dept: '-', grade: '-', maxPerDay: 0, isActive: true },
            { id: 'T01', name: 'นายสมชาย ใจดี', role: 'teacher', dept: 'คณิตศาสตร์, วิทยาศาสตร์', grade: 'ม.1, ม.2', maxPerDay: 4, isActive: true },
            { id: 'T02', name: 'นางสาวสมหญิง รักเรียน', role: 'teacher', dept: 'คณิตศาสตร์', grade: 'ม.2', maxPerDay: 4, isActive: true },
            { id: 'T03', name: 'นายวิชาญ ชาญวิทย์', role: 'teacher', dept: 'วิทยาศาสตร์', grade: 'ม.1', maxPerDay: 4, isActive: true },
            { id: 'T04', name: 'นางสมศรี ดีเสมอ', role: 'teacher', dept: 'ภาษาไทย', grade: 'ม.3', maxPerDay: 4, isActive: true },
        ];
        const MOCK_TIMETABLES = [
            { id: 'TERM_2569_1_T01_5_3', termId: 'TERM_2569_1', teacherId: 'T01', day: 5, data: { period: '3', subjectId: 'S01', roomId: 'R01', subject: 'คณิตศาสตร์พื้นฐาน', targetDept: 'คณิตศาสตร์', targetGrade: 'ม.1', classGroup: 'ม.1/1', room: '111' } },
            { id: 'TERM_2569_1_T01_5_4', termId: 'TERM_2569_1', teacherId: 'T01', day: 5, data: { period: '4', subjectId: 'S02', roomId: 'R02', subject: 'คณิตศาสตร์เพิ่มเติม', targetDept: 'คณิตศาสตร์', targetGrade: 'ม.1', classGroup: 'ม.1/2', room: '112' } },
            { id: 'TERM_2569_1_T02_5_1', termId: 'TERM_2569_1', teacherId: 'T02', day: 5, data: { period: '1', subjectId: 'S01', roomId: 'R03', subject: 'คณิตศาสตร์พื้นฐาน', targetDept: 'คณิตศาสตร์', targetGrade: 'ม.2', classGroup: 'ม.2/1', room: '211' } },
            { id: 'TERM_2569_1_T03_5_2', termId: 'TERM_2569_1', teacherId: 'T03', day: 5, data: { period: '2', subjectId: 'S03', roomId: 'R01', subject: 'วิทยาศาสตร์', targetDept: 'วิทยาศาสตร์', targetGrade: 'ม.1', classGroup: 'ม.1/1', room: '111' } },
            { id: 'TERM_2569_1_T04_5_1', termId: 'TERM_2569_1', teacherId: 'T04', day: 5, data: { period: '1', subjectId: 'S04', roomId: 'R04', subject: 'ภาษาไทย', targetDept: 'ภาษาไทย', targetGrade: 'ม.3', classGroup: 'ม.3/1', room: '311' } },
            { id: 'TERM_2569_1_T04_5_3', termId: 'TERM_2569_1', teacherId: 'T04', day: 5, data: { period: '3', subjectId: 'S04', roomId: 'R04', subject: 'ภาษาไทย', targetDept: 'ภาษาไทย', targetGrade: 'ม.3', classGroup: 'ม.3/1', room: '311' } }
        ];

        // --- Main App Component ---
        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false); 
            const [progress, setProgress] = useState({ show: false, message: '', percent: 0 });

            // Toast & Confirm State
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            const askConfirm = (message, onConfirm) => {
                setConfirmDialog({ message, onConfirm });
            };

            // Shared States
            const [sysConfig, setSysConfig] = useState(MOCK_SYS);
            const [terms, setTerms] = useState(MOCK_TERMS);
            const [departments, setDepartments] = useState(MOCK_DEPTS);
            const [grades, setGrades] = useState(MOCK_GRADES);
            const [rooms, setRooms] = useState(MOCK_ROOMS);
            const [subjects, setSubjects] = useState(MOCK_SUBJS);
            const [teachers, setTeachers] = useState(MOCK_TEACHERS);
            
            const [timetables, setTimetables] = useState({});
            const [leaves, setLeaves] = useState([]);
            const [substituteTasks, setSubstituteTasks] = useState([]);

            // UI States
            const currentTermId = terms.find(t=>t.isCurrent)?.id || (terms.length > 0 ? terms[0].id : ''); 
            const [currentUser, setCurrentUser] = useState(null); 
            const [activeTab, setActiveTab] = useState('home'); 
            const [manageTermId, setManageTermId] = useState(''); 
            const [authModal, setAuthModal] = useState({ isOpen: false, targetTab: '' });
            const [viewTeacherDetails, setViewTeacherDetails] = useState(null); 
            const [selectedTask, setSelectedTask] = useState(null);
            const [selectedDate, setSelectedDate] = useState(getTodayLocalStr());

            // --- DEFINITIONS & HELPERS ---
            const getTeacherName = (id) => teachers.find(t=>t.id === id)?.name || id;
            const isAdmin = currentUser?.role === 'admin';
            const activeTeachers = teachers.filter(t => t.isActive);

            // Filter out cancelled leaves dynamically for live views
            const liveLeaves = useMemo(() => leaves.filter(l => l.termId === currentTermId && l.status !== 'cancelled'), [leaves, currentTermId]);
            const liveTasks = useMemo(() => substituteTasks.filter(t => t.termId === currentTermId), [substituteTasks, currentTermId]);
            const adminTasks = useMemo(() => substituteTasks.filter(t => t.termId === manageTermId), [substituteTasks, manageTermId]);

            const getSubsInWeek = (teacherId, dateStr, tasksArr) => tasksArr.filter(st => st.assignedTo === teacherId && isSameWeek(st.date, dateStr)).length;

            const initLocalMockData = () => {
                const nested = {};
                MOCK_TIMETABLES.forEach(r => {
                    if(!nested[r.termId]) nested[r.termId] = {};
                    if(!nested[r.termId][r.teacherId]) nested[r.termId][r.teacherId] = {};
                    if(!nested[r.termId][r.teacherId][r.day]) nested[r.termId][r.teacherId][r.day] = [];
                    nested[r.termId][r.teacherId][r.day].push(r.data);
                });
                setTimetables(nested);
            };

            // Auto-Backup Hooks
            useEffect(() => {
                if (localStorage.getItem('auto_backup') === 'true' && !isLoading) {
                    let flatTimetables = [];
                    Object.keys(timetables).forEach(termId => {
                        Object.keys(timetables[termId]).forEach(teacherId => {
                            Object.keys(timetables[termId][teacherId]).forEach(day => {
                                timetables[termId][teacherId][day].forEach(slot => {
                                    flatTimetables.push({ id: `${termId}_${teacherId}_${day}_${slot.period}`, termId, teacherId, day: parseInt(day), data: slot });
                                });
                            });
                        });
                    });
                    const backupData = { sysConfig: [sysConfig], terms, departments, grades, rooms, subjects, teachers, leaves, substituteTasks, timetables: flatTimetables };
                    localStorage.setItem('auto_backup_data', JSON.stringify(backupData));
                    
                    const now = new Date().toLocaleString('th-TH');
                    localStorage.setItem('auto_backup_date', now);
                }
            }, [sysConfig, terms, departments, grades, rooms, subjects, teachers, leaves, substituteTasks, timetables, isLoading]);

            // --- Data Sync function ---
            const syncToSheets = async (action, sheet, payload, customMsg = 'กำลังบันทึกข้อมูลไปยังระบบ...') => {
                if (!SCRIPT_URL) return true;
                
                setProgress({ show: true, message: customMsg, percent: 10 });
                
                try {
                    const interval = setInterval(() => {
                        setProgress(prev => {
                            if (prev.percent < 85) return { ...prev, percent: prev.percent + Math.floor(Math.random() * 15) + 5 };
                            return prev;
                        });
                    }, 250);

                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, sheet, payload }),
                        redirect: 'follow'
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    clearInterval(interval);
                    setProgress({ show: true, message: 'บันทึกสำเร็จ!', percent: 100 });
                    setTimeout(() => setProgress({ show: false, message: '', percent: 0 }), 500);
                    return true;
                } catch (err) {
                    console.warn("Sheet sync error:", err);
                    setProgress({ show: false, message: '', percent: 0 });
                    showToast('อัปเดตไปยัง Sheets ล้มเหลว แต่ข้อมูลยังถูกจัดเก็บชั่วคราวในหน้าจอนี้', 'error');
                    return false;
                }
            };

            const loadDataFromSheets = async (isBackgroundPolling = false) => {
                if (!SCRIPT_URL) {
                    if(!isBackgroundPolling) {
                        initLocalMockData();
                        setIsLoading(false);
                    }
                    return;
                }

                if (!isBackgroundPolling) {
                    setIsRefreshing(true);
                    setProgress({ show: true, message: 'กำลังเชื่อมต่อและตรวจสอบระบบฐานข้อมูล...', percent: 15 });
                }

                try {
                    if (!isBackgroundPolling) setProgress(p => ({ ...p, percent: 40, message: 'กำลังอ่านข้อมูลโครงสร้างและตารางเรียน...' }));
                    const res = await fetch(SCRIPT_URL + '?action=getAll', { method: 'GET', redirect: 'follow' });
                    
                    if (!res.ok) throw new Error('Network response was not ok');
                    const data = await res.json();

                    if (!isBackgroundPolling) setProgress(p => ({ ...p, percent: 80, message: 'กำลังจัดระเบียบข้อมูล...' }));
                    
                    if(data.sysConfig && data.sysConfig.length > 0) setSysConfig(data.sysConfig[0]);
                    if(data.terms) setTerms(data.terms);
                    if(data.departments) setDepartments(data.departments);
                    if(data.grades) setGrades(data.grades);
                    if(data.rooms) setRooms(data.rooms);
                    if(data.subjects) setSubjects(data.subjects);
                    if(data.teachers) setTeachers(data.teachers);
                    if(data.leaves) setLeaves(data.leaves);
                    if(data.substituteTasks) setSubstituteTasks(data.substituteTasks);
                    
                    if(data.timetables) {
                        const nested = {};
                        data.timetables.forEach(r => {
                            if(!nested[r.termId]) nested[r.termId] = {};
                            if(!nested[r.termId][r.teacherId]) nested[r.termId][r.teacherId] = {};
                            if(!nested[r.termId][r.teacherId][r.day]) nested[r.termId][r.teacherId][r.day] = [];
                            nested[r.termId][r.teacherId][r.day].push(r.data);
                        });
                        setTimetables(nested);
                    }
                    if (!isBackgroundPolling) {
                        setProgress({ show: true, message: 'ดาวน์โหลดข้อมูลเสร็จสมบูรณ์!', percent: 100 });
                        setTimeout(() => setProgress({ show: false, message: '', percent: 0 }), 500);
                    }
                } catch (err) {
                    console.warn("Failed to load from Sheets:", err);
                    if (!isBackgroundPolling) {
                        setProgress({ show: false, message: '', percent: 0 });
                        showToast('โหลดข้อมูลล้มเหลว กำลังใช้ข้อมูลจำลองแทนชั่วคราว', 'info');
                    }
                    if (Object.keys(timetables).length === 0) {
                        initLocalMockData();
                    }
                } finally {
                    setIsLoading(false);
                    setIsRefreshing(false);
                }
            };

            // Initial Load & Real-time Polling
            useEffect(() => {
                loadDataFromSheets(false);
                const intervalId = setInterval(() => { loadDataFromSheets(true); }, 15000);
                return () => clearInterval(intervalId);
            }, []);

            useEffect(() => { if(!manageTermId && currentTermId) setManageTermId(currentTermId); }, [currentTermId, manageTermId]);

            // Create CRUD Actions wrapper
            const createCrudActions = (sheetName, localData, setLocalData) => ({
                add: async (i) => {
                    setLocalData(prev => { 
                        const idx = prev.findIndex(x => x.id === i.id); 
                        if (idx > -1) { const arr = [...prev]; arr[idx] = i; return arr; } 
                        return [...prev, { ...i, isActive: true }]; 
                    });
                    await syncToSheets('upsert', sheetName, i, `กำลังบันทึกข้อมูลลงตาราง ${sheetName}...`);
                    showToast('บันทึกข้อมูลสำเร็จ');
                },
                toggle: async (id) => {
                    const item = localData.find(x => x.id === id);
                    const updated = { ...item, isActive: !item.isActive };
                    setLocalData(p => p.map(x => x.id === id ? updated : x));
                    await syncToSheets('upsert', sheetName, updated, `กำลังอัปเดตสถานะของ ${id}...`);
                },
                del: (id) => {
                    askConfirm('ยืนยันการลบข้อมูลนี้หรือไม่?', async () => {
                        setLocalData(p => p.filter(x => x.id !== id));
                        await syncToSheets('delete', sheetName, { id }, `กำลังลบข้อมูล ${id} จากระบบ...`);
                        showToast('ลบข้อมูลสำเร็จ');
                    });
                },
                addBulk: async (items) => {
                    setLocalData(p => { 
                        const newArr = [...p]; 
                        items.forEach(item => { const idx = newArr.findIndex(x => x.id === item.id); if(idx > -1) newArr[idx] = item; else newArr.push(item); }); 
                        return newArr; 
                    });
                    await syncToSheets('batchUpsert', sheetName, items, `กำลังนำเข้าข้อมูลจํานวน ${items.length} รายการ...`);
                },
                delBulk: (ids) => {
                    askConfirm('ยืนยันลบข้อมูลหลายรายการที่เลือกไว้?', async () => {
                        setLocalData(p => p.filter(x => !ids.includes(x.id)));
                        await syncToSheets('batchDelete', sheetName, ids, `กำลังลบข้อมูลจํานวน ${ids.length} รายการ...`);
                        showToast('ลบข้อมูลที่เลือกสำเร็จ');
                    });
                }
            });

            const termActions = createCrudActions('terms', terms, setTerms);
            const deptActions = createCrudActions('departments', departments, setDepartments);
            const gradeActions = createCrudActions('grades', grades, setGrades);
            const roomActions = createCrudActions('rooms', rooms, setRooms);
            const subjActions = createCrudActions('subjects', subjects, setSubjects);
            const teacherActions = createCrudActions('teachers', teachers, setTeachers);

            const dbActions = {
                updateSysConfig: async (cfg) => { 
                    setSysConfig(cfg); 
                    await syncToSheets('upsert', 'sysConfig', { id: 'main', ...cfg }, 'กำลังอัปเดตการตั้งค่าระบบ...');
                    showToast('บันทึกการตั้งค่าระบบเรียบร้อย');
                },
                setCurrentTerm: async (id) => {
                    const updatedTerms = terms.map(t => {
                        if (t.id === id) return { ...t, isCurrent: true, isActive: true }; // Force active
                        return { ...t, isCurrent: false };
                    });
                    setTerms(updatedTerms);
                    await syncToSheets('batchUpsert', 'terms', updatedTerms, 'กำลังอัปเดตภาคเรียนปัจจุบัน...');
                    showToast('ตั้งค่าภาคเรียนปัจจุบันสำเร็จ');
                },
                addTerm: termActions.add, toggleTerm: termActions.toggle, delTerm: termActions.del,
                addDept: deptActions.add, toggleDept: deptActions.toggle, delDept: deptActions.del,
                addGrade: gradeActions.add, toggleGrade: gradeActions.toggle, delGrade: gradeActions.del,
                addRoom: roomActions.add, toggleRoom: roomActions.toggle, delRoom: roomActions.del,
                addSubj: subjActions.add, toggleSubj: subjActions.toggle, delSubj: subjActions.del,
                addTeacher: teacherActions.add, toggleTeacher: teacherActions.toggle, delTeacher: teacherActions.del, addTeacherBulk: teacherActions.addBulk, deleteTeacherBulk: teacherActions.delBulk,
                
                addTimetableSlot: async (termId, teacherId, day, slotData) => {
                    const id = `${termId}_${teacherId}_${day}_${slotData.period}`;
                    const flatObj = { id, termId, teacherId, day, data: slotData };
                    setTimetables(p => {
                        const newTt = {...p};
                        if(!newTt[termId]) newTt[termId] = {}; if(!newTt[termId][teacherId]) newTt[termId][teacherId] = {}; if(!newTt[termId][teacherId][day]) newTt[termId][teacherId][day] = [];
                        newTt[termId][teacherId][day].push(slotData);
                        return newTt;
                    });
                    await syncToSheets('upsert', 'timetables', flatObj, 'กำลังเพิ่มคาบลงตารางเรียน...');
                    showToast('เพิ่มคาบสอนสำเร็จ');
                },
                delTimetableSlot: (termId, teacherId, day, period) => {
                    askConfirm('ลบคาบสอนนี้ใช่หรือไม่?', async () => {
                        const id = `${termId}_${teacherId}_${day}_${period}`;
                        setTimetables(p => {
                            const newTt = JSON.parse(JSON.stringify(p));
                            if(newTt[termId]?.[teacherId]?.[day]) newTt[termId][teacherId][day] = newTt[termId][teacherId][day].filter(s => s.period !== period);
                            return newTt;
                        });
                        await syncToSheets('delete', 'timetables', { id }, 'กำลังลบคาบเรียน...');
                        showToast('ลบคาบสอนสำเร็จ');
                    });
                },
                addTimetableBulk: async (termId, newSlots) => {
                    setTimetables(p => {
                        const newTt = {...p};
                        if(!newTt[termId]) newTt[termId] = {};
                        newSlots.forEach(slot => {
                            if(!newTt[termId][slot.teacherId]) newTt[termId][slot.teacherId] = {};
                            if(!newTt[termId][slot.teacherId][slot.day]) newTt[termId][slot.teacherId][slot.day] = [];
                            if(!newTt[termId][slot.teacherId][slot.day].some(s => s.period === slot.data.period)) {
                                newTt[termId][slot.teacherId][slot.day].push(slot.data);
                                newTt[termId][slot.teacherId][slot.day].sort((a,b)=>a.period - b.period);
                            }
                        });
                        return newTt;
                    });
                    
                    const flatSlots = newSlots.map(s => ({
                        id: `${termId}_${s.teacherId}_${s.day}_${s.data.period}`,
                        termId, teacherId: s.teacherId, day: s.day, data: s.data
                    }));
                    await syncToSheets('batchUpsert', 'timetables', flatSlots, `กำลังอิมพอร์ตข้อมูลตารางสอนจำนวน ${newSlots.length} คาบ...`);
                },
                deleteTimetableBulk: (termId, slotsToDelete) => {
                    askConfirm('ยืนยันลบคาบสอนที่เลือกทั้งหมด?', async () => {
                        setTimetables(p => {
                            const newTt = JSON.parse(JSON.stringify(p)); 
                            slotsToDelete.forEach(d => {
                                if(newTt[termId] && newTt[termId][d.teacherId] && newTt[termId][d.teacherId][d.day]) {
                                    newTt[termId][d.teacherId][d.day] = newTt[termId][d.teacherId][d.day].filter(s => s.period !== d.period);
                                }
                            });
                            return newTt;
                        });
                        const ids = slotsToDelete.map(d => `${termId}_${d.teacherId}_${d.day}_${d.period}`);
                        await syncToSheets('batchDelete', 'timetables', ids, `กำลังลบตารางสอนจํานวน ${ids.length} คาบ...`);
                        showToast(`ลบข้อมูลสำเร็จ ${ids.length} รายการ`);
                    });
                },
                
                replaceTableData: async (tableName, newItems) => {
                    if (!Array.isArray(newItems)) return;
                    let localSetter;
                    let currentData = [];
                    
                    switch(tableName) {
                        case 'sysConfig': localSetter = setSysConfig; currentData = [sysConfig]; break;
                        case 'terms': localSetter = setTerms; currentData = terms; break;
                        case 'departments': localSetter = setDepartments; currentData = departments; break;
                        case 'grades': localSetter = setGrades; currentData = grades; break;
                        case 'rooms': localSetter = setRooms; currentData = rooms; break;
                        case 'subjects': localSetter = setSubjects; currentData = subjects; break;
                        case 'teachers': localSetter = setTeachers; currentData = teachers; break;
                        case 'leaves': localSetter = setLeaves; currentData = leaves; break;
                        case 'substituteTasks': localSetter = setSubstituteTasks; currentData = substituteTasks; break;
                        case 'timetables': localSetter = null; break;
                    }

                    if (tableName !== 'timetables') {
                        if (tableName === 'sysConfig') {
                            localSetter(newItems[0] || newItems);
                            if (newItems.length > 0) await syncToSheets('upsert', tableName, { id: 'main', ...newItems[0] }, `กำลังกู้คืน ${tableName}...`);
                        } else {
                            localSetter(newItems);
                            if (currentData.length > 0) await syncToSheets('batchDelete', tableName, currentData.map(d=>d.id), `ล้างข้อมูลเดิม ${tableName}...`);
                            if (newItems.length > 0) await syncToSheets('batchUpsert', tableName, newItems, `กำลังกู้คืน ${tableName}...`);
                        }
                    } else {
                        // Rebuild nested timetables
                        const nested = {};
                        newItems.forEach(r => {
                            if(!nested[r.termId]) nested[r.termId] = {};
                            if(!nested[r.termId][r.teacherId]) nested[r.termId][r.teacherId] = {};
                            if(!nested[r.termId][r.teacherId][r.day]) nested[r.termId][r.teacherId][r.day] = [];
                            nested[r.termId][r.teacherId][r.day].push(r.data);
                        });
                        setTimetables(nested);
                        
                        let flatTimetables = [];
                        Object.keys(timetables).forEach(termId => {
                            Object.keys(timetables[termId]).forEach(teacherId => {
                                Object.keys(timetables[termId][teacherId]).forEach(day => {
                                    timetables[termId][teacherId][day].forEach(slot => {
                                        flatTimetables.push(`${termId}_${teacherId}_${day}_${slot.period}`);
                                    });
                                });
                            });
                        });
                        if (flatTimetables.length > 0) await syncToSheets('batchDelete', 'timetables', flatTimetables, `ล้างข้อมูลเดิม ตารางสอน...`);
                        if (newItems.length > 0) await syncToSheets('batchUpsert', 'timetables', newItems, `กำลังกู้คืน ตารางสอน...`);
                    }
                },

                // ปรุงฐานข้อมูล: ตรวจสอบและปรับปรุงข้อมูลทั้งหมดให้สัมพันธ์กันโดยอัตโนมัติ
                repairDatabase: async () => {
                    const result = { fixedSlots: 0, removedSlots: 0, fixedTasks: 0, removedTasks: 0, removedLeaves: 0, fixedTeachers: 0 };

                    const teacherIds = new Set(teachers.map(t => t.id));
                    const subjectMap = {}; subjects.forEach(s => subjectMap[s.id] = s);
                    const roomMap = {}; rooms.forEach(r => roomMap[r.id] = r);
                    const deptNames = new Set(departments.map(d => d.name));
                    const gradeNames = new Set(grades.map(g => g.name));
                    const termIds = new Set(terms.map(t => t.id));

                    // 1) ตรวจสอบ/ซ่อมตารางสอน (timetables)
                    const newTimetables = {};
                    const timetableUpserts = [];
                    const timetableDeleteIds = [];
                    Object.keys(timetables).forEach(termId => {
                        const termValid = termIds.has(termId);
                        if (termValid) newTimetables[termId] = {};
                        Object.keys(timetables[termId]).forEach(teacherId => {
                            const teacherValid = termValid && teacherIds.has(teacherId);
                            if (teacherValid) newTimetables[termId][teacherId] = {};
                            Object.keys(timetables[termId][teacherId]).forEach(day => {
                                const daySlots = timetables[termId][teacherId][day] || [];
                                if (!teacherValid) {
                                    daySlots.forEach(slot => { timetableDeleteIds.push(`${termId}_${teacherId}_${day}_${slot.period}`); result.removedSlots++; });
                                    return;
                                }
                                const fixedSlots = [];
                                daySlots.forEach(slot => {
                                    const subjObj = subjectMap[slot.subjectId];
                                    const roomObj = roomMap[slot.roomId];
                                    if (!subjObj || !roomObj) {
                                        timetableDeleteIds.push(`${termId}_${teacherId}_${day}_${slot.period}`);
                                        result.removedSlots++;
                                        return;
                                    }
                                    const fixedSlot = { period: slot.period, subjectId: slot.subjectId, roomId: slot.roomId, subject: subjObj.name, targetDept: subjObj.dept, targetGrade: roomObj.grade, classGroup: roomObj.classGroup, room: roomObj.name };
                                    if (JSON.stringify(fixedSlot) !== JSON.stringify(slot)) {
                                        result.fixedSlots++;
                                        timetableUpserts.push({ id: `${termId}_${teacherId}_${day}_${slot.period}`, termId, teacherId, day: parseInt(day), data: fixedSlot });
                                    }
                                    fixedSlots.push(fixedSlot);
                                });
                                if (teacherValid && fixedSlots.length > 0) newTimetables[termId][teacherId][day] = fixedSlots;
                            });
                        });
                    });

                    // 2) ตรวจสอบ/ซ่อมข้อมูลการลา (leaves) - ลบรายการที่อ้างอิงครูซึ่งถูกลบไปแล้ว
                    const newLeaves = [];
                    const leaveDeleteIds = [];
                    const validLeaveIds = new Set();
                    leaves.forEach(l => {
                        if (!teacherIds.has(l.requesterId)) {
                            leaveDeleteIds.push(l.id);
                            result.removedLeaves++;
                            return;
                        }
                        newLeaves.push(l);
                        validLeaveIds.add(l.id);
                    });

                    // 3) ตรวจสอบ/ซ่อมคาบสอนแทน (substituteTasks)
                    const newTasks = [];
                    const taskUpserts = [];
                    const taskDeleteIds = [];
                    substituteTasks.forEach(t => {
                        if (!teacherIds.has(t.requesterId) || (t.leaveId && !validLeaveIds.has(t.leaveId))) {
                            taskDeleteIds.push(t.id);
                            result.removedTasks++;
                            return;
                        }
                        if (t.assignedTo && !teacherIds.has(t.assignedTo)) {
                            const fixedTask = { ...t, assignedTo: null, status: 'pending' };
                            result.fixedTasks++;
                            taskUpserts.push(fixedTask);
                            newTasks.push(fixedTask);
                        } else {
                            newTasks.push(t);
                        }
                    });

                    // 4) ตรวจสอบ/ซ่อมข้อมูลกลุ่มสาระฯ และระดับชั้นของครู ให้ตรงกับรายการที่มีอยู่จริง
                    const newTeachers = teachers.map(t => {
                        if (t.role !== 'teacher') return t;
                        const fixedDept = (t.dept || '').split(',').map(d => d.trim()).filter(d => d && deptNames.has(d)).join(', ');
                        const fixedGrade = (t.grade || '').split(',').map(g => g.trim()).filter(g => g && gradeNames.has(g)).join(', ');
                        if (fixedDept !== (t.dept || '') || fixedGrade !== (t.grade || '')) {
                            result.fixedTeachers++;
                            return { ...t, dept: fixedDept, grade: fixedGrade };
                        }
                        return t;
                    });
                    const teacherUpserts = newTeachers.filter((t, i) => t !== teachers[i]);

                    // ใช้ค่าที่ปรับปรุงแล้วกับ state
                    setTimetables(newTimetables);
                    setLeaves(newLeaves);
                    setSubstituteTasks(newTasks);
                    if (teacherUpserts.length > 0) setTeachers(newTeachers);

                    // ส่งข้อมูลที่แก้ไขแล้วไปซิงค์กับ Google Sheets
                    if (timetableDeleteIds.length > 0) await syncToSheets('batchDelete', 'timetables', timetableDeleteIds, `กำลังลบข้อมูลตารางสอนที่ไม่สมบูรณ์ (${timetableDeleteIds.length} รายการ)...`);
                    if (timetableUpserts.length > 0) await syncToSheets('batchUpsert', 'timetables', timetableUpserts, `กำลังซิงค์ข้อมูลตารางสอน (${timetableUpserts.length} รายการ)...`);
                    if (leaveDeleteIds.length > 0) await syncToSheets('batchDelete', 'leaves', leaveDeleteIds, `กำลังลบข้อมูลการลาที่ไม่สมบูรณ์ (${leaveDeleteIds.length} รายการ)...`);
                    if (taskDeleteIds.length > 0) await syncToSheets('batchDelete', 'substituteTasks', taskDeleteIds, `กำลังลบคาบสอนแทนที่ไม่สมบูรณ์ (${taskDeleteIds.length} รายการ)...`);
                    if (taskUpserts.length > 0) await syncToSheets('batchUpsert', 'substituteTasks', taskUpserts, `กำลังซิงค์ข้อมูลคาบสอนแทน (${taskUpserts.length} รายการ)...`);
                    if (teacherUpserts.length > 0) await syncToSheets('batchUpsert', 'teachers', teacherUpserts, `กำลังซิงค์ข้อมูลครู (${teacherUpserts.length} รายการ)...`);

                    return result;
                }
            };

            // --- LEAVE MANAGEMENT ACTIONS ---
            const handleCreateLeave = async (newLeave) => {
                const isDuplicate = leaves.some(l => 
                    l.requesterId === newLeave.requesterId && 
                    l.date === newLeave.date && 
                    l.reason === newLeave.reason &&
                    l.status !== 'cancelled'
                );
                if (isDuplicate) {
                    return showToast('ตรวจพบว่าคุณได้แจ้งลาในวันที่และสาเหตุนี้ไปแล้ว!', 'error');
                }

                const leaveId = 'L' + Date.now().toString().slice(-4);
                const leaveRecord = { ...newLeave, id: leaveId, termId: currentTermId, status: 'approved' };
                
                const d = new Date(newLeave.date);
                const dayOfWeek = d.getDay();
                const timetableToday = timetables[currentTermId]?.[newLeave.requesterId]?.[dayOfWeek] || [];

                const newTasks = timetableToday.map((t, index) => ({
                    id: `TASK_${leaveId}_${index}`,
                    termId: currentTermId,
                    leaveId: leaveId,
                    requesterId: newLeave.requesterId,
                    date: newLeave.date,
                    period: t.period,
                    subject: t.subject,
                    targetDept: t.targetDept,
                    targetGrade: t.targetGrade,
                    classGroup: t.classGroup,
                    room: t.room,
                    status: 'pending',
                    assignedTo: null
                }));

                setLeaves(prev => [...prev, leaveRecord]);
                setSubstituteTasks(prev => [...prev, ...newTasks]);
                
                await syncToSheets('upsert', 'leaves', leaveRecord, 'กำลังสร้างเอกสารลางาน...');
                if (newTasks.length > 0) {
                    await syncToSheets('batchUpsert', 'substituteTasks', newTasks, `กำลังวิเคราะห์และจัดทำคาบสอนแทนอัตโนมัติ (${newTasks.length} คาบ)...`);
                }

                showToast('แจ้งลางานและสร้างคาบสอนแทนอัตโนมัติสำเร็จ');
                setActiveTab('home');
            };

            const handleRequestCancelLeave = async (leaveId) => {
                askConfirm('คุณต้องการส่งคำขอยกเลิกการลานี้ให้แอดมินพิจารณาใช่หรือไม่?', async () => {
                    const leave = leaves.find(l => l.id === leaveId);
                    if(!leave) return;
                    const updated = { ...leave, status: 'cancel_requested' };
                    setLeaves(prev => prev.map(l => l.id === leaveId ? updated : l));
                    await syncToSheets('upsert', 'leaves', updated, 'กำลังส่งคำขอยกเลิก...');
                    showToast('ส่งคำขอยกเลิกการลาแล้ว กรุณารอแอดมินอนุมัติ', 'info');
                });
            };

            const handleAdminCancelLeave = async (leaveId) => {
                askConfirm('ยืนยันการยกเลิกการลานี้? (ระบบจะลบคาบสอนแทนที่เกี่ยวข้องทั้งหมดด้วย)', async () => {
                    const leave = leaves.find(l => l.id === leaveId);
                    const updatedLeave = { ...leave, status: 'cancelled' };
                    
                    const tasksToDelete = substituteTasks.filter(t => t.leaveId === leaveId);
                    const taskIdsToDelete = tasksToDelete.map(t => t.id);

                    setLeaves(prev => prev.map(l => l.id === leaveId ? updatedLeave : l));
                    setSubstituteTasks(prev => prev.filter(t => t.leaveId !== leaveId));

                    await syncToSheets('upsert', 'leaves', updatedLeave, 'กำลังอัปเดตสถานะการลา...');
                    if (taskIdsToDelete.length > 0) {
                        await syncToSheets('batchDelete', 'substituteTasks', taskIdsToDelete, 'กำลังลบคาบสอนแทนที่เกี่ยวข้อง...');
                    }
                    showToast('ยกเลิกการลาและเคลียร์ตารางสอนแทนเรียบร้อยแล้ว');
                });
            };

            // --- AUTO & MANUAL ASSIGN ACTIONS ---
            const getSuggestedTeachers = (task, contextTasks = substituteTasks) => {
                let available = activeTeachers.filter(t => t.role === 'teacher' && t.id !== task.requesterId);
                const dayOfWeek = new Date(task.date).getDay();
                const taskTermTasks = contextTasks.filter(st => st.termId === task.termId);
                const taskTermLeaves = leaves.filter(l => l.termId === task.termId);

                available = available.filter(t => {
                    if (taskTermLeaves.some(l => l.requesterId === t.id && l.date === task.date && l.status !== 'cancelled')) return false;
                    if ((timetables[task.termId]?.[t.id]?.[dayOfWeek] || []).some(s => s.period === task.period)) return false;

                    t.isBusySubbing = taskTermTasks.some(st => st.id !== task.id && st.date === task.date && st.period === task.period && st.assignedTo === t.id); 
                    const regularCount = (timetables[task.termId]?.[t.id]?.[dayOfWeek] || []).length;
                    const subCountToday = taskTermTasks.filter(st => st.id !== task.id && st.date === task.date && st.assignedTo === t.id).length;
                    t.currentLoad = regularCount + subCountToday;
                    t.maxLoad = t.maxPerDay || sysConfig.defaultMaxPerDay;

                    const isDeptMatch = (t.dept || '').split(',').map(d=>d.trim()).includes(task.targetDept);
                    if (sysConfig.autoRules.mustMatchDept && !isDeptMatch) return false;
                    const isGradeMatch = (t.grade || '').split(',').map(g=>g.trim()).includes(task.targetGrade);
                    if (sysConfig.autoRules.mustMatchGrade && !isGradeMatch) return false;

                    return true;
                });
                
                let scored = available.map(t => {
                    let score = 0; let tags = [];
                    if (t.isBusySubbing) { score -= 1000; tags.push({ text: 'สอนควบห้อง (ซ้อนคาบ)', color: 'bg-red-100 text-red-800 border-red-200' }); }
                    const isDeptMatch = (t.dept || '').split(',').map(d=>d.trim()).includes(task.targetDept);
                    const isGradeMatch = (t.grade || '').split(',').map(g=>g.trim()).includes(task.targetGrade);

                    if (isDeptMatch && isGradeMatch) { score += 50; tags.push({ text: 'ตรงกลุ่มสาระฯ+ชั้น', color: 'bg-green-100 text-green-800' }); }
                    else if (isDeptMatch) { score += 30; tags.push({ text: 'กลุ่มสาระฯ เดียวกัน', color: 'bg-blue-100 text-blue-800' }); }
                    else if (isGradeMatch) { score += 20; tags.push({ text: 'ระดับชั้นเดียวกัน', color: 'bg-indigo-100 text-indigo-800' }); }

                    t.subThisWeek = taskTermTasks.filter(st => st.assignedTo === t.id && isSameWeek(st.date, task.date)).length;
                    t.subLastWeek = taskTermTasks.filter(st => st.assignedTo === t.id && isLastWeek(st.date, task.date)).length;
                    t.termSubCount = taskTermTasks.filter(st => st.assignedTo === t.id).length; 
                    
                    if (sysConfig.autoRules.balanceLoad) score -= (t.subThisWeek * 10);
                    return { ...t, score, tags };
                });

                return scored.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.currentLoad - b.currentLoad; 
                });
            };

            const executeAssign = async (taskId, teacherId) => {
                try {
                    const task = substituteTasks.find(t => t.id === taskId);
                    const updatedTask = { ...task, status: teacherId ? 'assigned' : 'pending', assignedTo: teacherId };
                    setSubstituteTasks(prev => prev.map(st => st.id === taskId ? updatedTask : st));
                    setSelectedTask(null);
                    await syncToSheets('upsert', 'substituteTasks', updatedTask, 'กำลังบันทึกการจัดคาบสอนแทน...');
                    showToast(teacherId ? 'มอบหมายครูสอนแทนสำเร็จ' : 'ยกเลิกการมอบหมายสำเร็จ', teacherId ? 'success' : 'info');
                } catch(e) {
                    console.warn(e);
                }
            };

            const handleAssignTask = (taskId, teacherId) => {
                const task = substituteTasks.find(t => t.id === taskId);
                if (teacherId && substituteTasks.some(st => st.id !== taskId && st.termId === task.termId && st.date === task.date && st.period === task.period && st.assignedTo === teacherId)) {
                    askConfirm('คำเตือน: ครูท่านนี้ถูกจัดให้สอนแทนห้องอื่นในวันและคาบนี้อยู่แล้ว\nคุณต้องการให้สอนควบห้องใช่หรือไม่?', () => executeAssign(taskId, teacherId));
                } else {
                    executeAssign(taskId, teacherId);
                }
            };

            const handleAutoAssignSingle = (task) => {
                try {
                    const safeSuggestions = getSuggestedTeachers(task).filter(s => s.score > -500); 
                    if (safeSuggestions.length > 0) handleAssignTask(task.id, safeSuggestions[0].id);
                    else {
                        setSelectedTask(task);
                        showToast('ไม่สามารถจัดอัตโนมัติได้ กรุณาเลือกเอง', 'error');
                    }
                } catch(e) {
                    console.warn("Auto Assign Error:", e);
                }
            };

            const handleAutoAssignAll = (targetDate) => {
                askConfirm(`ต้องการจัดครูสอนแทนอัตโนมัติสำหรับวันที่ ${targetDate} หรือไม่?`, async () => {
                    try {
                        let currentTasks = [...substituteTasks];
                        let pendingTasks = currentTasks.filter(t => t.termId === manageTermId && t.status === 'pending' && t.date === targetDate);
                        let successCount = 0;
                        let updates = [];

                        pendingTasks.forEach(task => {
                            const safeSuggestions = getSuggestedTeachers(task, currentTasks).filter(s => s.score > -500); 
                            let target = safeSuggestions.find(s => s.currentLoad < s.maxLoad);
                            if (!target && sysConfig.autoRules.ignoreMaxLoadIfEmpty && safeSuggestions.length > 0) target = safeSuggestions[0];
                            if (target) {
                                currentTasks = currentTasks.map(st => st.id === task.id ? { ...st, status: 'assigned', assignedTo: target.id } : st);
                                updates.push({ id: task.id, status: 'assigned', assignedTo: target.id });
                                successCount++;
                            }
                        });
                        
                        setSubstituteTasks(currentTasks);
                        const finalUpdates = updates.map(u => ({...substituteTasks.find(x=>x.id===u.id), ...u}));
                        
                        if(finalUpdates.length > 0) {
                            await syncToSheets('batchUpsert', 'substituteTasks', finalUpdates, `ระบบจัดสรรอัจฉริยะกำลังจับคู่ผู้สอนแทน (${updates.length} คาบ)...`);
                        }
                        
                        showToast(`จัดอัตโนมัติสำเร็จ ${successCount} รายการ, ไม่สำเร็จ ${pendingTasks.length - successCount} รายการ`);
                    } catch(e) {
                        console.warn("Bulk Auto Assign Error:", e);
                    }
                });
            };

            const handleCardClick = (tab) => {
                if (tab === 'leave' || tab === 'reports') setActiveTab(tab); 
                else if (tab === 'admin' || tab === 'settings' || tab === 'slip') {
                    if (!isAdmin) setAuthModal({ isOpen: true, targetTab: tab }); 
                    else setActiveTab(tab);
                } else setActiveTab(tab);
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-50 relative">
                    {progress.show && (
                        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gray-900 bg-opacity-70 p-4">
                            <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center fade-in">
                                <div className="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
                                    <div className="absolute inset-0 rounded-full border-4 border-indigo-100"></div>
                                    <div className="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
                                    <span className="text-xl font-bold text-indigo-600">{progress.percent}%</span>
                                </div>
                                <h3 className="text-lg font-bold text-gray-800 mb-2">โปรดรอสักครู่</h3>
                                <p className="text-gray-500 text-sm mb-4">{progress.message}</p>
                                <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                    <div className="bg-indigo-600 h-full transition-all duration-300 rounded-full" style={{ width: `${progress.percent}%` }}></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast.show && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 fade-in">
                            <div className={`px-6 py-3 rounded-lg shadow-lg font-medium text-white flex items-center ${toast.type === 'error' ? 'bg-red-600' : toast.type === 'info' ? 'bg-blue-600' : 'bg-green-600'}`}>
                                <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : toast.type === 'info' ? 'fa-info-circle' : 'fa-check-circle'} mr-3 text-xl`}></i>
                                {toast.message}
                            </div>
                        </div>
                    )}

                    {confirmDialog && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 fade-in p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center">
                                <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4"><i className="fas fa-question-circle"></i></div>
                                <h3 className="text-lg font-bold text-gray-800 mb-2">ยืนยันการดำเนินการ</h3>
                                <p className="text-gray-600 mb-6 text-sm">{confirmDialog.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded-lg font-medium hover:bg-gray-300 transition-colors">ยกเลิก</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors">ตกลง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                    {sysConfig.logoUrl ? (
                                        <img src={sysConfig.logoUrl} alt="Logo" className="h-10 w-auto object-contain rounded-lg shadow-sm border" onError={(e)=>{e.target.onerror = null; e.target.src="https://via.placeholder.com/150?text=LogoError"}} />
                                    ) : <div className="bg-blue-600 text-white p-2 rounded-lg"><i className="fas fa-chalkboard-teacher text-xl"></i></div>}
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-lg sm:text-xl font-semibold text-gray-800">{sysConfig.name}</h1>
                                        <span className="hidden sm:inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded-full border border-indigo-200">
                                            ภาคเรียน {terms.find(t=>t.isCurrent)?.name}
                                        </span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 sm:gap-4">
                                    <button onClick={() => loadDataFromSheets(false)} className={`text-gray-500 hover:text-blue-600 p-2 rounded-full transition-colors ${isRefreshing ? 'bg-blue-50' : ''}`} title="รีเฟรชข้อมูลล่าสุด">
                                        <i className={`fas fa-sync-alt ${isRefreshing ? 'fa-spin text-blue-600' : ''}`}></i>
                                    </button>
                                    <button onClick={() => setActiveTab('reports')} className={`hidden sm:flex px-3 py-1.5 rounded-lg text-sm font-medium transition-colors items-center ${activeTab === 'reports' ? 'bg-indigo-100 text-indigo-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                                        <i className="fas fa-chart-bar mr-2"></i>รายงาน
                                    </button>
                                    {isAdmin ? (
                                        <>
                                        <button onClick={() => setActiveTab('settings')} className={`hidden sm:flex px-3 py-1.5 rounded-lg text-sm font-medium transition-colors items-center ${activeTab === 'settings' ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                                            <i className="fas fa-database mr-2"></i>ตั้งค่า
                                        </button>
                                        <button onClick={() => setActiveTab('slip')} className={`hidden sm:flex px-3 py-1.5 rounded-lg text-sm font-medium transition-colors items-center ${activeTab === 'slip' ? 'bg-teal-100 text-teal-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                                            <i className="fas fa-file-signature mr-2"></i>ส่งสอนแทน
                                        </button>
                                        <div className="hidden lg:block border-l h-6 mx-2 border-gray-300"></div>
                                        <div className="text-sm font-semibold text-purple-700 px-3 hidden sm:block">โหมดแอดมิน</div>
                                        <button onClick={() => { setCurrentUser(null); setActiveTab('home'); showToast('ออกจากระบบแอดมินแล้ว', 'info'); }} className="px-3 py-1.5 rounded-lg text-sm font-medium text-red-500 hover:bg-red-50 transition-colors border border-transparent hover:border-red-200" title="ออกจากระบบแอดมิน">
                                            <i className="fas fa-sign-out-alt"></i>
                                        </button>
                                        </>
                                    ) : (
                                        <button onClick={() => setAuthModal({isOpen: true, targetTab: 'admin'})} className="px-4 py-1.5 rounded-lg text-sm font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200 transition-colors">
                                            <i className="fas fa-lock sm:mr-2"></i><span className="hidden sm:inline">เข้าสู่ระบบผู้ดูแล</span>
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>

                    {authModal.isOpen && (
                        <div className="fixed inset-0 z-40 overflow-y-auto bg-gray-900 bg-opacity-60 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 fade-in relative">
                                <button onClick={() => setAuthModal({isOpen: false, targetTab: ''})} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3"><i className="fas fa-user-shield"></i></div>
                                    <h3 className="text-xl font-bold text-gray-800">ยืนยันตัวตน</h3>
                                    <p className="text-sm text-gray-500 mt-1">กรุณากรอกรหัสผ่านเพื่อเข้าสู่โหมดผู้ดูแลระบบ</p>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault(); const pwd = new FormData(e.target).get('password');
                                    if(pwd === sysConfig.password) { setCurrentUser(teachers.find(t=>t.role === 'admin')); setActiveTab(authModal.targetTab || 'admin'); setAuthModal({isOpen: false, targetTab: ''}); showToast('เข้าสู่ระบบสำเร็จ'); } 
                                    else { showToast('รหัสผ่านไม่ถูกต้อง', 'error'); }
                                }}>
                                    <input type="password" name="password" autoFocus required placeholder="ระบุรหัสผ่าน..." className="w-full border border-gray-300 rounded-lg px-4 py-3 mb-6 focus:ring-purple-500 text-center text-xl tracking-[0.5em] font-mono outline-none shadow-sm" />
                                    <button type="submit" className="w-full bg-purple-600 text-white py-3 rounded-lg font-medium hover:bg-purple-700 transition-colors shadow-sm">เข้าสู่ระบบ</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'home' && (
                            <div className="fade-in space-y-8 no-print">
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">เมนูหลัก</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                                        <ActionCard icon="fa-clipboard-list" title="รายการสอนแทน" desc="ดูตารางวันนี้" borderColor="border-blue-500" textColor="text-blue-600" bgHover="hover:bg-blue-50" onClick={() => document.getElementById('today-board').scrollIntoView({ behavior: 'smooth' })} />
                                        <ActionCard icon="fa-paper-plane" title="แจ้งลางาน" desc="ขอจัดสอนแทน" borderColor="border-green-500" textColor="text-green-600" bgHover="hover:bg-green-50" onClick={() => handleCardClick('leave')} />
                                        <ActionCard icon="fa-tasks" title="จัดคนสอนแทน" desc="(แอดมิน)" borderColor="border-purple-500" textColor="text-purple-600" bgHover="hover:bg-purple-50" onClick={() => handleCardClick('admin')} />
                                        <ActionCard icon="fa-file-signature" title="ส่งสอนแทน" desc="พิมพ์ใบบันทึก (แอดมิน)" borderColor="border-teal-500" textColor="text-teal-600" bgHover="hover:bg-teal-50" onClick={() => handleCardClick('slip')} />
                                        <ActionCard icon="fa-chart-pie" title="รายงานสรุป" desc="สถิติ (สาธารณะ)" borderColor="border-indigo-500" textColor="text-indigo-600" bgHover="hover:bg-indigo-50" onClick={() => handleCardClick('reports')} />
                                    </div>
                                </div>
                                <div id="today-board" className="pt-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2 border-l-4 border-indigo-500 pl-3">
                                        <h2 className="text-xl font-bold text-gray-800">รายการสำหรับวันที่ {selectedDate}</h2>
                                        <div className="flex items-center gap-2">
                                            <span className="text-sm font-semibold text-gray-500">เปลี่ยนวันที่เรียกดู:</span>
                                            <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="border border-indigo-200 rounded px-2 py-1 text-sm bg-indigo-50 text-indigo-900 font-bold focus:ring-indigo-500 outline-none cursor-pointer" />
                                        </div>
                                    </div>
                                    <PublicBoard tasks={liveTasks} leaves={liveLeaves} getTeacherName={getTeacherName} getSubsInWeek={getSubsInWeek} allTasks={substituteTasks} onViewTeacher={(id)=>setViewTeacherDetails(id)} selectedDate={selectedDate} setSelectedDate={setSelectedDate} />
                                </div>
                            </div>
                        )}

                        {activeTab === 'admin' && isAdmin && (
                            <div className="fade-in space-y-4 no-print">
                                <button onClick={() => setActiveTab('home')} className="text-gray-500 hover:text-blue-600 font-medium flex items-center mb-4 transition-colors"><i className="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก</button>
                                <AdminDashboard terms={terms.filter(t=>t.isActive)} manageTermId={manageTermId} setManageTermId={setManageTermId} tasks={adminTasks} leaves={leaves} onOpenMatch={setSelectedTask} onAutoAssign={handleAutoAssignSingle} onAutoAssignAll={handleAutoAssignAll} getTeacherName={getTeacherName} getSubsInWeek={getSubsInWeek} allTasks={substituteTasks} onViewTeacher={(id)=>setViewTeacherDetails(id)} onAdminCancelLeave={handleAdminCancelLeave} />
                            </div>
                        )}

                        {activeTab === 'leave' && (
                            <div className="fade-in space-y-4 no-print">
                                <button onClick={() => setActiveTab('home')} className="text-gray-500 hover:text-blue-600 font-medium flex items-center mb-4 transition-colors"><i className="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก</button>
                                <LeaveForm onSubmit={handleCreateLeave} teachers={activeTeachers} departments={departments.filter(d=>d.isActive)} selectedDate={selectedDate} showToast={showToast} leaves={leaves} onRequestCancelLeave={handleRequestCancelLeave} />
                            </div>
                        )}

                        {activeTab === 'settings' && isAdmin && (
                            <div className="fade-in no-print">
                                <AdminSettings db={{ sysConfig, terms, departments, grades, rooms, subjects, teachers, timetables, leaves, substituteTasks }} manageTermId={manageTermId} setManageTermId={setManageTermId} actions={dbActions} askConfirm={askConfirm} showToast={showToast} />
                            </div>
                        )}

                        {activeTab === 'slip' && isAdmin && (
                            <div className="fade-in space-y-4">
                                <button onClick={() => setActiveTab('home')} className="text-gray-500 hover:text-blue-600 font-medium flex items-center mb-4 transition-colors no-print"><i className="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก</button>
                                <SubstituteSlip sysConfig={sysConfig} leaves={leaves} tasks={substituteTasks} teachers={teachers} subjects={subjects} getTeacherName={getTeacherName} currentTermId={currentTermId} selectedDate={selectedDate} setSelectedDate={setSelectedDate} showToast={showToast} />
                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <ReportsDashboard terms={terms.filter(t=>t.isActive)} manageTermId={manageTermId} setManageTermId={setManageTermId} teachers={teachers} leaves={leaves} tasks={substituteTasks} departments={departments} onBack={() => setActiveTab('home')} />
                        )}
                    </main>

                    {/* Modals */}
                    {viewTeacherDetails && (
                        <TeacherDetailsModal teacherId={viewTeacherDetails} termId={currentTermId} terms={terms} leaves={leaves} tasks={substituteTasks} getTeacherName={getTeacherName} onClose={() => setViewTeacherDetails(null)} />
                    )}

                    {selectedTask && isAdmin && (
                        <MatchModal task={selectedTask} suggestions={getSuggestedTeachers(selectedTask)} onClose={() => setSelectedTask(null)} onAssign={(tId) => handleAssignTask(selectedTask.id, tId)} onUnassign={() => handleAssignTask(selectedTask.id, null)} askConfirm={askConfirm} />
                    )}
                </div>
            );
        }

        // --- Extracted UI Components ---
        function ActionCard({ icon, title, desc, borderColor, textColor, bgHover, onClick }) {
            return (
                <div onClick={onClick} className={`bg-white rounded-xl shadow-sm border border-gray-100 border-t-4 ${borderColor} p-4 sm:p-6 cursor-pointer transition-all duration-200 transform hover:-translate-y-1 hover:shadow-md ${bgHover} group`}>
                    <div className="flex items-center gap-3 sm:gap-4"><div className={`w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-50 flex items-center justify-center text-xl sm:text-2xl ${textColor} group-hover:scale-110 transition-transform`}><i className={`fas ${icon}`}></i></div><div><h3 className="text-md sm:text-lg font-bold text-gray-800">{title}</h3><p className="text-xs sm:text-sm text-gray-500 mt-1">{desc}</p></div></div>
                </div>
            );
        }

        function TeacherDetailsModal({ teacherId, termId, terms, leaves, tasks, getTeacherName, onClose }) {
            const [viewTab, setViewTab] = useState('subFor');

            const currentTerm = terms.find(t => t.id === termId);
            const termName = currentTerm?.name || '';

            // --- ข้อมูลการลา (ครูคนนี้ลา) ---
            const myLeaves = useMemo(() =>
                leaves.filter(l => l.requesterId === teacherId && l.termId === termId && l.status !== 'cancelled')
                      .sort((a,b) => new Date(b.date) - new Date(a.date)),
                [leaves, teacherId, termId]);

            // --- คาบที่ครูคนนี้เคยไปสอนแทนคนอื่น ---
            const subForOthers = useMemo(() =>
                tasks.filter(t => t.assignedTo === teacherId && t.termId === termId && t.status === 'assigned')
                     .sort((a,b) => new Date(b.date) - new Date(a.date) || parseInt(a.period) - parseInt(b.period)),
                [tasks, teacherId, termId]);

            // --- คาบที่มีคนมาสอนแทนครูคนนี้ ---
            const subForMe = useMemo(() =>
                tasks.filter(t => t.requesterId === teacherId && t.termId === termId && t.assignedTo)
                     .sort((a,b) => new Date(b.date) - new Date(a.date) || parseInt(a.period) - parseInt(b.period)),
                [tasks, teacherId, termId]);

            const TABS = [
                { key: 'subFor',    label: 'เคยสอนแทนใคร',    icon: 'fa-chalkboard-teacher', color: 'green',  count: subForOthers.length },
                { key: 'subByOther', label: 'ใครเคยสอนแทน',   icon: 'fa-user-friends',       color: 'blue',   count: subForMe.length },
                { key: 'leaves',    label: 'ประวัติลางาน',     icon: 'fa-sign-out-alt',       color: 'red',    count: myLeaves.length },
            ];

            const colorMap = {
                green:  { tab: 'bg-green-600',  ring: 'ring-green-400',  badge: 'bg-green-100 text-green-800 border-green-200', line: 'border-green-200', dot: 'bg-green-500',  hdr: 'text-green-600' },
                blue:   { tab: 'bg-blue-600',   ring: 'ring-blue-400',   badge: 'bg-blue-100 text-blue-800 border-blue-200',    line: 'border-blue-200',  dot: 'bg-blue-500',   hdr: 'text-blue-600'  },
                red:    { tab: 'bg-red-600',     ring: 'ring-red-400',    badge: 'bg-red-100 text-red-700 border-red-200',       line: 'border-red-200',   dot: 'bg-red-500',    hdr: 'text-red-600'   },
            };

            // helper: group items by date
            const groupByDate = (arr) => {
                const map = {};
                arr.forEach(item => {
                    if (!map[item.date]) map[item.date] = [];
                    map[item.date].push(item);
                });
                return Object.entries(map).sort(([a],[b]) => new Date(b) - new Date(a));
            };

            const formatDate = (d) => {
                if (!d) return '';
                const dt = new Date(d);
                const days = ['อา','จ','อ','พ','พฤ','ศ','ส'];
                return `${days[dt.getDay()]} ${d}`;
            };

            return (
                <div className="fixed inset-0 z-40 overflow-y-auto">
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="fixed inset-0 bg-gray-900 bg-opacity-60" onClick={onClose}></div>
                        <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl fade-in overflow-hidden flex flex-col max-h-[90vh]">

                            {/* Header */}
                            <div className="bg-gradient-to-r from-indigo-700 to-indigo-500 px-6 py-4 flex justify-between items-center flex-shrink-0">
                                <div>
                                    <div className="flex items-center gap-2 text-white">
                                        <i className="fas fa-user-circle text-2xl text-indigo-200"></i>
                                        <span className="text-lg font-bold">{getTeacherName(teacherId)}</span>
                                    </div>
                                    <div className="text-indigo-200 text-xs mt-0.5">
                                        <i className="fas fa-calendar-check mr-1"></i>ภาคเรียน {termName} — ข้อมูลทั้งภาคเรียน
                                    </div>
                                </div>
                                <button onClick={onClose} className="text-indigo-200 hover:text-white p-2 rounded-full hover:bg-indigo-600 transition-colors">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                            </div>

                            {/* Summary Cards */}
                            <div className="grid grid-cols-3 gap-0 border-b flex-shrink-0">
                                {TABS.map(tab => {
                                    const c = colorMap[tab.color];
                                    const active = viewTab === tab.key;
                                    return (
                                        <button key={tab.key} onClick={() => setViewTab(tab.key)}
                                            className={`py-3 px-2 text-center transition-all border-b-2 ${active ? `border-${tab.color === 'green' ? 'green' : tab.color === 'blue' ? 'blue' : 'red'}-500 bg-${tab.color === 'green' ? 'green' : tab.color === 'blue' ? 'blue' : 'red'}-50` : 'border-transparent hover:bg-gray-50'}`}>
                                            <div className={`text-2xl font-bold ${active ? c.hdr : 'text-gray-700'}`}>{tab.count}</div>
                                            <div className={`text-xs font-medium mt-0.5 ${active ? c.hdr : 'text-gray-500'}`}>
                                                <i className={`fas ${tab.icon} mr-1`}></i>{tab.label}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Tab Content */}
                            <div className="flex-1 overflow-y-auto custom-scrollbar bg-gray-50 p-4">

                                {/* TAB 1: เคยสอนแทนใคร */}
                                {viewTab === 'subFor' && (
                                    <div className="fade-in space-y-3">

                        {termLeaves.filter(l => l.status !== 'cancelled').map(l => (
                            <tr key={l.id} className={l.status === 'cancel_requested' ? 'bg-orange-50' : 'hover:bg-gray-50'}>
                                <td className="px-4 sm:px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-800">{l.date}</td>
                                <td className="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-blue-600 font-medium cursor-pointer hover:underline" onClick={()=>onViewTeacher(task.requesterId)}>{getTeacherName(l.requesterId)}</td>
                                <td className="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-600">{l.reason}</td>
                                <td className="px-4 sm:px-6 py-4 whitespace-nowrap text-center">
                                    {l.status === 'cancel_requested' ? <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-xs font-bold animate-pulse"><i className="fas fa-exclamation-circle mr-1"></i> ขอยกเลิก</span> : <span className="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold">อนุมัติปกติ</span>}
                                </td>
                                <td className="px-4 sm:px-6 py-4 whitespace-nowrap text-right text-sm">
                                    <button onClick={() => onAdminCancelLeave(l.id)} className="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-3 py-1.5 rounded transition-colors font-medium shadow-sm">
                                        <i className="fas fa-trash-alt mr-1"></i> {l.status === 'cancel_requested' ? 'อนุมัติการยกเลิก' : 'ยกเลิกการลานี้'}
                                    </button>
                                </td>
                            </tr>
                        ))}
                        {termLeaves.filter(l => l.status !== 'cancelled').length === 0 && <tr><td colSpan="5" className="text-center py-8 text-gray-500">ไม่มีข้อมูลการลาที่ดำเนินการอยู่</td></tr>}
                    </tbody></table></div>
                )}
            </div>
            );
        }

        function MatchModal({ task, suggestions, onClose, onAssign, onUnassign, askConfirm }) {
            return (
            <div className="fixed inset-0 z-40 overflow-y-auto"><div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0"><div className="fixed inset-0 bg-gray-900 bg-opacity-60" onClick={onClose}></div><span className="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
                <div className="inline-block align-bottom bg-white rounded-xl text-left shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl w-full fade-in">
                    <div className="bg-white px-4 sm:px-6 py-4 border-b flex flex-wrap justify-between items-center gap-2"><h3 className="text-lg font-semibold flex items-center flex-wrap gap-2"><i className="fas fa-user-check text-purple-500 mr-2"></i>เลือกครูสอนแทน (คาบ {task.period})<span className="bg-indigo-100 text-indigo-800 text-sm sm:text-base font-bold px-2 py-0.5 rounded border border-indigo-200">ชั้น {task.classGroup}</span></h3><button onClick={onClose} className="text-gray-400 hover:text-gray-600 p-2"><i className="fas fa-times text-xl"></i></button></div>
                    <div className="px-4 sm:px-6 py-4 bg-gray-50 h-96 overflow-y-auto"><div className="space-y-3">
                        {suggestions.map((t, index) => {
