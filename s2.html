                            const isCurrent = t.id === task.assignedTo;
                            const isDoubleBooking = t.score <= -500; 
                            return (
                                <div key={t.id} className={`bg-white border p-4 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm ${isCurrent ? 'border-purple-500 bg-purple-50 ring-1 ring-purple-50 ring-1 ring-purple-500' : 'hover:border-purple-300'} ${isDoubleBooking && !isCurrent ? 'border-red-200 bg-red-50' : ''}`}>
                                    <div><div className="font-semibold flex items-center flex-wrap gap-2">{t.name} {isCurrent && <span className="text-xs text-purple-700 bg-purple-100 border border-purple-200 px-2 py-0.5 rounded-full font-bold"><i className="fas fa-check mr-1"></i> ผู้สอนปัจจุบัน</span>}</div><div className="text-sm text-gray-500 flex flex-wrap items-center gap-2 sm:gap-3 mt-1.5"><span className="bg-gray-100 px-2 py-0.5 rounded">{t.dept} ({t.grade})</span><span className={`font-medium ${t.currentLoad >= t.maxLoad - 1 ? 'text-orange-500' : 'text-green-600'}`}><i className="fas fa-briefcase mr-1"></i>ภาระงาน: {t.currentLoad}/{t.maxLoad}</span><span className="text-blue-600"><i className="fas fa-history mr-1"></i>สะสมวีคนี้: {t.subThisWeek} | วีคก่อน: {t.subLastWeek} | เทอมนี้: {t.termSubCount}</span></div>{t.tags.map((tag, i) => <div key={i} className={`mt-2 inline-block text-xs font-bold px-2 py-1 rounded border ${tag.color} mr-1`}>{tag.text}</div>)}</div>
                                    {!isCurrent && <button onClick={() => onAssign(t.id)} className={`bg-white border px-4 py-2 rounded-lg text-sm font-medium w-full sm:w-auto transition-colors shadow-sm ${isDoubleBooking ? 'border-red-500 text-red-600 hover:bg-red-600 hover:text-white' : 'border-purple-200 text-purple-600 hover:bg-purple-600 hover:text-white'}`}>มอบหมาย</button>}
                                </div>
                            )
                        })}
                        {suggestions.length === 0 && <div className="text-center py-10 text-gray-500 bg-white border border-dashed border-gray-300 rounded-lg">ไม่มีครูที่ว่างในคาบนี้ หรือภาระงานเต็มแล้ว</div>}
                    </div></div>
                    {task.status === 'assigned' && <div className="px-4 sm:px-6 py-3 bg-gray-100 border-t flex justify-between"><button onClick={() => askConfirm('ยกเลิกการมอบหมายสำหรับคาบนี้?', onUnassign)} className="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1.5 rounded-lg text-sm font-medium"><i className="fas fa-times-circle mr-1"></i>ยกเลิกการมอบหมาย</button></div>}
                </div>
            </div></div>
            );
        }

        function LeaveForm({ onSubmit, teachers, departments, selectedDate, showToast, leaves, onRequestCancelLeave }) {
            const [selectedDept, setSelectedDept] = useState('');
            const [formData, setFormData] = useState({ requesterId: '', date: selectedDate || '2026-06-26', reason: 'ไปราชการ' });
            
            useEffect(() => {
                if (selectedDate) {
                    setFormData(prev => ({ ...prev, date: selectedDate }));
                }
            }, [selectedDate]);

            const filteredTeachers = useMemo(() => teachers.filter(t => t.dept.includes(selectedDept)), [teachers, selectedDept]);
            const myLeaves = useMemo(() => leaves.filter(l => l.requesterId === formData.requesterId && l.status !== 'cancelled').sort((a,b) => new Date(b.date) - new Date(a.date)), [leaves, formData.requesterId]);
            
            const handleSubmit = (e) => { e.preventDefault(); if(!formData.requesterId) return showToast('กรุณาเลือกครูผู้ลา', 'error'); onSubmit(formData); };
            
            return (
                <div className="fade-in max-w-lg mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div className="px-6 py-4 border-b border-gray-200 bg-gray-50"><h2 className="text-lg font-semibold text-gray-800"><i className="fas fa-paper-plane mr-2 text-green-600"></i>แจ้งลางาน / ไปราชการ</h2></div>
                    <div className="p-4 sm:p-6">
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">1. เลือกกลุ่มสาระฯ</label><select className="w-full border rounded-lg px-3 py-2 outline-none focus:ring-1 focus:ring-green-500" value={selectedDept} onChange={e => { setSelectedDept(e.target.value); setFormData({...formData, requesterId: ''}); }}><option value="" disabled>-- เลือกกลุ่มสาระ --</option>{departments.map(d => <option key={d.name} value={d.name}>{d.name}</option>)}</select></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">2. เลือกชื่อครูของคุณ</label><select className="w-full border rounded-lg px-3 py-2 outline-none focus:ring-1 focus:ring-green-500 disabled:bg-gray-100" value={formData.requesterId} onChange={e => setFormData({...formData, requesterId: e.target.value})} disabled={!selectedDept} required><option value="" disabled>-- เลือกชื่อ --</option>{filteredTeachers.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">3. วันที่ลา</label><input type="date" required className="w-full border rounded-lg px-3 py-2 focus:ring-1 focus:ring-green-500" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">4. สาเหตุ</label><select className="w-full border rounded-lg px-3 py-2 focus:ring-1 focus:ring-green-500" value={formData.reason} onChange={e => setFormData({...formData, reason: e.target.value})}><option value="ไปราชการ">ไปราชการ</option><option value="ลาป่วย">ลาป่วย</option><option value="ลากิจ">ลากิจ</option><option value="เหตุอื่นๆ">เหตุอื่นๆ</option></select></div>
                            </div>
                            <div className="pt-4"><button type="submit" disabled={!formData.requesterId} className="w-full py-2.5 bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white rounded-lg font-medium shadow-sm transition-colors"><i className="fas fa-check mr-2"></i> ยืนยันการแจ้งลา</button></div>
                        </form>

                        {formData.requesterId && myLeaves.length > 0 && (
                            <div className="mt-8 border-t border-gray-200 pt-6">
                                <h3 className="text-md font-bold text-gray-800 mb-4"><i className="fas fa-history mr-2 text-indigo-500"></i>ประวัติการลาของคุณ</h3>
                                <div className="space-y-3">
                                    {myLeaves.map(l => (
                                        <div key={l.id} className="bg-white border rounded-lg p-4 shadow-sm flex justify-between items-center hover:shadow-md transition-shadow">
                                            <div>
                                                <div className="font-bold text-gray-800">{l.date}</div>
                                                <div className="text-sm text-gray-600 mb-1">สาเหตุ: {l.reason}</div>
                                                <div className="text-xs">
                                                    {l.status === 'approved' && <span className="text-green-600 font-bold bg-green-100 px-2 py-0.5 rounded border border-green-200">อนุมัติแล้ว</span>}
                                                    {l.status === 'cancel_requested' && <span className="text-orange-600 font-bold bg-orange-100 px-2 py-0.5 rounded border border-orange-200 animate-pulse">รอแอดมินยกเลิก...</span>}
                                                </div>
                                            </div>
                                            {l.status === 'approved' && (
                                                <button onClick={() => onRequestCancelLeave(l.id)} className="text-red-500 hover:text-red-700 bg-red-50 border border-red-200 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                                                    ขอยกเลิกการลา
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function ReportsDashboard({ terms, manageTermId, setManageTermId, teachers, departments, leaves, tasks, onBack }) {
            const [reportTitle, setReportTitle] = useState('รายงานสรุปการจัดสอนแทน');
            const [startDate, setStartDate] = useState(getCurrentWeekStartStr()); 
            const [endDate, setEndDate] = useState(getTodayLocalStr());
            const [filterDept, setFilterDept] = useState(''); const [filterTeacher, setFilterTeacher] = useState('');

            useEffect(() => { setFilterTeacher(''); }, [filterDept]);

            const filteredLeaves = useMemo(() => {
                return leaves.filter(l => {
                    if (l.termId !== manageTermId || l.status === 'cancelled') return false;
                    if (startDate && l.date < startDate) return false;
                    if (endDate && l.date > endDate) return false;
                    return true;
                });
            }, [leaves, manageTermId, startDate, endDate]);

            const filteredTasks = useMemo(() => {
                return tasks.filter(t => {
                    if (t.termId !== manageTermId || t.status !== 'assigned') return false;
                    if (startDate && t.date < startDate) return false;
                    if (endDate && t.date > endDate) return false;
                    return true;
                });
            }, [tasks, manageTermId, startDate, endDate]);
            
            const activeTeacherList = useMemo(() => {
                let list = teachers.filter(t => t.role === 'teacher' && t.isActive);
                if (filterDept) list = list.filter(t => t.dept.includes(filterDept));
                if (filterTeacher) list = list.filter(t => t.id === filterTeacher);
                return list;
            }, [teachers, filterDept, filterTeacher]);

            const teacherStats = useMemo(() => {
                return activeTeacherList.map(teacher => {
                    const leaveCount = filteredLeaves.filter(l => l.requesterId === teacher.id).length;
                    const subCount = filteredTasks.filter(t => t.assignedTo === teacher.id).length;
                    return { ...teacher, leaveCount, subCount };
                });
            }, [activeTeacherList, filteredLeaves, filteredTasks]);

            const topSubstitutes = [...teacherStats].sort((a,b) => b.subCount - a.subCount).filter(t => t.subCount > 0);
            const zeroLeaves = teacherStats.filter(t => t.leaveCount === 0);
            const chartLabels = topSubstitutes.map(t => t.name);
            const chartData = topSubstitutes.map(t => t.subCount);

            return (
                <div className="fade-in space-y-6">
                    <div className="no-print flex justify-between items-center mb-4"><button onClick={onBack} className="text-gray-500 hover:text-blue-600 font-medium flex items-center transition-colors"><i className="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก</button><button onClick={() => window.print()} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm flex items-center"><i className="fas fa-print mr-2"></i> พิมพ์รายงาน</button></div>
                    <div id="printable-report" className="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
                        <div className="text-center mb-8 border-b pb-4"><input type="text" className="print-input text-2xl font-bold text-gray-800 text-center w-full bg-transparent border-none outline-none focus:ring-2 focus:ring-indigo-100 rounded p-1 mb-2" value={reportTitle} onChange={e=>setReportTitle(e.target.value)} title="คลิกเพื่อแก้ไขหัวรายงาน" /><div className="mt-3 flex items-center justify-center text-gray-600 font-medium no-print"><span>ภาคเรียนที่: </span><select className="ml-2 border border-gray-300 rounded p-1 text-sm bg-white focus:ring-indigo-500 font-bold text-indigo-700" value={manageTermId} onChange={e=>setManageTermId(e.target.value)}>{terms.map(t => <option key={t.id} value={t.id}>{t.name} {t.isCurrent && '(ปัจจุบัน)'}</option>)}</select></div><div className="mt-2 text-gray-600 font-medium print-only hidden">ภาคเรียนที่: {terms.find(t=>t.id === manageTermId)?.name}{startDate && endDate ? ` (ตั้งแต่ ${startDate} ถึง ${endDate})` : ''}{filterDept ? ` | กลุ่มสาระฯ: ${filterDept}` : ''}{filterTeacher ? ` | ครู: ${teachers.find(t=>t.id===filterTeacher)?.name}` : ''}</div></div>

                        <div className="no-print bg-gray-50 p-4 rounded-lg mb-8 border border-gray-200 space-y-4"><div className="font-semibold text-gray-700 text-sm"><i className="fas fa-filter mr-2"></i>ตัวกรองข้อมูลรายงาน</div><div className="flex flex-wrap gap-4 items-end"><div><label className="block text-xs font-medium text-gray-700 mb-1">ตั้งแต่วันที่</label><input type="date" className="border border-gray-300 rounded p-2 text-sm" value={startDate} onChange={e=>setStartDate(e.target.value)} /></div><div><label className="block text-xs font-medium text-gray-700 mb-1">ถึงวันที่</label><input type="date" className="border border-gray-300 rounded p-2 text-sm" value={endDate} onChange={e=>setEndDate(e.target.value)} /></div><div className="border-l h-8 mx-2 border-gray-300 hidden sm:block"></div><div><label className="block text-xs font-medium text-gray-700 mb-1">กลุ่มสาระการเรียนรู้</label><select className="border border-gray-300 rounded p-2 text-sm bg-white min-w-[150px]" value={filterDept} onChange={e=>setFilterDept(e.target.value)}><option value="">ทั้งหมด (เปรียบเทียบ)</option>{departments.filter(d=>d.isActive).map(d => <option key={d.id} value={d.name}>{d.name}</option>)}</select></div><div><label className="block text-xs font-medium text-gray-700 mb-1">ครูผู้สอน</label><select className="border border-gray-300 rounded p-2 text-sm bg-white min-w-[150px]" value={filterTeacher} onChange={e=>setFilterTeacher(e.target.value)}><option value="">ทุกคนในกลุ่ม</option>{teachers.filter(t=>t.role === 'teacher' && t.isActive && (!filterDept || t.dept.includes(filterDept))).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select></div><button onClick={()=>{setStartDate(getCurrentWeekStartStr());setEndDate(getTodayLocalStr());setFilterDept('');setFilterTeacher('');}} className="text-sm text-gray-500 hover:text-red-500 px-2 py-2">รีเซ็ตตัวกรอง</button></div></div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"><div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg"><p className="text-sm text-blue-600 font-medium">คำร้องขอลาทั้งหมด</p><p className="text-3xl font-bold text-gray-800">{filteredLeaves.length} <span className="text-sm font-normal text-gray-500">ครั้ง</span></p></div><div className="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg"><p className="text-sm text-indigo-600 font-medium">คาบที่มีการสอนแทน</p><p className="text-3xl font-bold text-gray-800">{filteredTasks.length} <span className="text-sm font-normal text-gray-500">คาบ</span></p></div><div className="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg"><p className="text-sm text-green-600 font-medium">ครูที่สอนแทนมากสุด</p><p className="text-xl font-bold text-gray-800 line-clamp-1">{topSubstitutes[0]?.name || '-'}</p></div><div className="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-r-lg"><p className="text-sm text-yellow-600 font-medium">ครูที่ไม่ลาเลย</p><p className="text-3xl font-bold text-gray-800">{zeroLeaves.length} <span className="text-sm font-normal text-gray-500">คน</span></p></div></div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 print-break-inside-avoid"><div><h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">กราฟสรุปจำนวนคาบสอนแทน</h3><div className="border border-gray-200 rounded-lg p-4 bg-white" style={{height: '350px'}}>{chartData.length > 0 ? <BarChart labels={chartLabels} data={chartData} title="จำนวนคาบสอนแทน" /> : <div className="h-full flex items-center justify-center text-gray-400">ไม่มีข้อมูลในช่วงเวลานี้</div>}</div></div><div><h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">อันดับครูสอนแทนมากที่สุด</h3><div className="overflow-x-auto border border-gray-200 rounded-lg mb-6"><table className="min-w-full divide-y divide-gray-200 text-sm"><thead className="bg-indigo-50"><tr><th className="px-4 py-2 text-left">อันดับ</th><th className="px-4 py-2 text-left">ชื่อ-สกุล</th><th className="px-4 py-2 text-right">จำนวนคาบ</th></tr></thead><tbody className="divide-y divide-gray-200">{topSubstitutes.slice(0,5).map((t, i) => (<tr key={t.id}><td className="px-4 py-2 font-bold text-gray-500">{i+1}</td><td className="px-4 py-2 font-medium">{t.name}</td><td className="px-4 py-2 text-right font-bold text-indigo-600">{t.subCount}</td></tr>))}{topSubstitutes.length === 0 && <tr><td colSpan="3" className="text-center py-4 text-gray-400">ไม่มีข้อมูล</td></tr>}</tbody></table></div><h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">รายชื่อครูที่ไม่เคยลาเลย</h3><div className="overflow-x-auto border border-gray-200 rounded-lg"><table className="min-w-full divide-y divide-gray-200 text-sm"><tbody className="divide-y divide-gray-200">{zeroLeaves.map(t => (<tr key={t.id}><td className="px-4 py-2"><i className="fas fa-award text-yellow-500 mr-2"></i> {t.name}</td><td className="px-4 py-2 text-gray-500">{t.dept}</td></tr>))}{zeroLeaves.length === 0 && <tr><td colSpan="2" className="text-center py-4 text-gray-400">ไม่มีข้อมูล</td></tr>}</tbody></table></div></div></div>
                    </div>
                </div>
            );
        }

        function BarChart({ labels, data, title }) {
            const chartRef = useRef(null); const chartInstance = useRef(null);
            useEffect(() => {
                if (chartInstance.current) { chartInstance.current.destroy(); }
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, { type: 'bar', data: { labels: labels, datasets: [{ label: title, data: data, backgroundColor: '#4f46e5', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); }
            }, [labels, data, title]);
            return <canvas ref={chartRef}></canvas>;
        }

        // --- ใบบันทึกการจัดสอนแทน (พิมพ์ได้ / คัดลอกได้) ---
        function SubstituteSlip({ sysConfig, leaves, tasks, teachers, subjects, getTeacherName, currentTermId, selectedDate, setSelectedDate, showToast }) {
            const REASON_OPTIONS = ['ไปราชการ', 'ลาป่วย', 'ลากิจ'];
            const NAME_PREFIX_REGEX = /^(นางสาว|นาง|นาย|ว่าที่ร้อยตรีหญิง|ว่าที่ร้อยตรี|ดร\.|ผศ\.ดร\.|รศ\.ดร\.|ศ\.ดร\.|ผศ\.|รศ\.|ศ\.|อาจารย์)\s*/;

            const [docTitle, setDocTitle] = useState('แบบบันทึกการจัดสอนแทน');
            const [schoolLine, setSchoolLine] = useState(sysConfig.name || 'โรงเรียนพนมรุ้ง สำนักงานเขตพื้นที่การศึกษามัธยมศึกษาบุรีรัมย์');
            const [toLine, setToLine] = useState('เรียน คณะครูผู้สอน');
            const [introText, setIntroText] = useState('ด้วยวันที่ดังกล่าว มีครูโรงเรียนไม่ได้มาปฏิบัติราชการ โรงเรียนจึงทำการจัดสอนแทนดังรายการต่อไปนี้');
            const [closingLine, setClosingLine] = useState('จึงเรียนมาเพื่อทราบและปฏิบัติ');
            const [signerName, setSignerName] = useState('(....................................)');
            const [signerTitle, setSignerTitle] = useState('รองผู้อำนวยการโรงเรียน');
            const [isCapturing, setIsCapturing] = useState(false);

            const dayLeaves = useMemo(() => leaves.filter(l => l.date === selectedDate && l.status !== 'cancelled'), [leaves, selectedDate]);

            const formatThaiDate = (dateStr) => {
                if (!dateStr) return '';
                const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
                const d = new Date(dateStr);
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            // หารหัสวิชาจากชื่อวิชาที่บันทึกไว้ในคาบสอนแทน เพื่อแสดงคู่กับชื่อวิชา
            const getSubjectDisplay = (subjectName) => {
                const found = subjects.find(s => s.name === subjectName);
                return found ? `${found.code} ${subjectName}` : subjectName;
            };

            // แสดงชื่อผู้สอนแทนแค่ชื่อตัว ถ้ามีชื่อซ้ำกับครูคนอื่น ให้ใส่อักษรตัวแรกของนามสกุลในวงเล็บ
            const getShortSubName = (teacherId) => {
                if (!teacherId) return '-';
                const t = teachers.find(x => x.id === teacherId);
                if (!t) return getTeacherName(teacherId);
                const cleaned = t.name.replace(NAME_PREFIX_REGEX, '').trim();
                const parts = cleaned.split(/\s+/);
                const firstName = parts[0] || cleaned;
                const lastName = parts.slice(1).join(' ');
                const duplicateCount = teachers.filter(o => o.role === 'teacher').filter(o => {
                    const c2 = o.name.replace(NAME_PREFIX_REGEX, '').trim();
                    const f2 = c2.split(/\s+/)[0] || c2;
                    return f2 === firstName;
                }).length;
                if (duplicateCount > 1 && lastName) {
                    return `${firstName} (${lastName.charAt(0)}.)`;
                }
                return firstName;
            };

            const handleCopy = async () => {
                if (typeof html2canvas === 'undefined') {
                    showToast('ไม่พบไลบรารีสำหรับจับภาพหน้าจอ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต', 'error');
                    return;
                }
                const target = document.getElementById('printable-slip');
                if (!target) return;

                setIsCapturing(true);

                // 1) แปลง input/textarea เป็น span ชั่วคราว เพื่อให้ html2canvas เห็นข้อความ
                const inputs = target.querySelectorAll('input[type="text"],textarea');
                const savedInputStyles = [];
                inputs.forEach(inp => {
                    savedInputStyles.push({ el: inp, display: inp.style.display });
                    const span = document.createElement('span');
                    span.textContent = inp.value;
                    span.className = inp.className.replace('print-input','') + ' inline-block';
                    inp.parentNode.insertBefore(span, inp);
                    inp.style.display = 'none';
                    inp._captureSpan = span;
                });

                // 2) ขยาย overflow เพื่อให้ตารางไม่ถูกตัด
                const overflowEls = target.querySelectorAll('[class*="overflow"]');
                const savedOverflow = [];
                overflowEls.forEach(el => {
                    savedOverflow.push({ el, overflow: el.style.overflow, maxHeight: el.style.maxHeight });
                    el.style.overflow = 'visible';
                    el.style.maxHeight = 'none';
                });

                // 3) จับภาพ
                try {
                    const canvas = await html2canvas(target, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        useCORS: true,
                        allowTaint: false,
                        logging: false,
                        scrollX: 0,
                        scrollY: 0,
                        width: target.scrollWidth,
                        height: target.scrollHeight,
                        windowWidth: target.scrollWidth + 100,
                    });

                    // 4) คืนสภาพ DOM
                    inputs.forEach(inp => {
                        if (inp._captureSpan) { inp._captureSpan.remove(); delete inp._captureSpan; }
                        inp.style.display = savedInputStyles.find(x=>x.el===inp)?.display || '';
                    });
                    overflowEls.forEach(({ el, overflow, maxHeight }) => { el.style.overflow = overflow; el.style.maxHeight = maxHeight; });

                    setIsCapturing(false);

                    canvas.toBlob(async (blob) => {
                        if (!blob) { showToast('ไม่สามารถสร้างภาพได้', 'error'); return; }
                        try {
                            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                            showToast('คัดลอกภาพใบบันทึกไปยังคลิปบอร์ดแล้ว วาง (Ctrl+V) ได้ทันที');
                        } catch (err) {
                            // fallback: download
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url; a.download = `substitute_slip_${selectedDate}.png`; a.click();
                            URL.revokeObjectURL(url);
                            showToast('เบราว์เซอร์ไม่รองรับการคัดลอกภาพ — ดาวน์โหลดไฟล์ .png ให้แทน', 'info');
                        }
                    }, 'image/png');
                } catch (err) {
                    // restore on error too
                    inputs.forEach(inp => {
                        if (inp._captureSpan) { inp._captureSpan.remove(); delete inp._captureSpan; }
                        inp.style.display = savedInputStyles.find(x=>x.el===inp)?.display || '';
                    });
                    overflowEls.forEach(({ el, overflow, maxHeight }) => { el.style.overflow = overflow; el.style.maxHeight = maxHeight; });
                    setIsCapturing(false);
                    showToast('เกิดข้อผิดพลาดขณะจับภาพหน้าจอ: ' + err.message, 'error');
                }
            };

            return (
                <div className="fade-in space-y-4">
                    <div className="no-print flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
                        <div className="flex items-center gap-2">
                            <label className="text-sm font-semibold text-gray-600">วันที่จัดสอนแทน:</label>
                            <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="border border-teal-200 rounded px-2 py-1.5 text-sm bg-teal-50 text-teal-900 font-bold focus:ring-teal-500 outline-none" />
                            <span className="text-xs text-gray-400">({dayLeaves.length} รายการ)</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleCopy} disabled={isCapturing} className="bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 disabled:opacity-60 px-4 py-2 rounded-lg text-sm font-medium">{isCapturing ? <React.Fragment><i className="fas fa-spinner fa-spin mr-2"></i>กำลังจับภาพ...</React.Fragment> : <React.Fragment><i className="fas fa-camera mr-2"></i>คัดลอก (ภาพ)</React.Fragment>}</button>
                            <button onClick={() => window.print()} className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm"><i className="fas fa-print mr-2"></i>พิมพ์ / บันทึกเป็น PDF</button>
                        </div>
                    </div>

                    <div id="printable-slip" className="bg-white border border-gray-200 rounded-xl shadow-sm p-6 sm:p-8 max-w-5xl mx-auto">
                        <div className="text-center mb-4">
                            {sysConfig.logoUrl && <img src={sysConfig.logoUrl} alt="logo" className="h-16 mx-auto mb-2 object-contain" />}
                            <input type="text" value={docTitle} onChange={e=>setDocTitle(e.target.value)} className="print-input text-lg font-bold text-center w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded" />
                            <input type="text" value={schoolLine} onChange={e=>setSchoolLine(e.target.value)} className="print-input text-sm text-center w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded" />
                        </div>

                        <div className="flex justify-between items-baseline text-sm mb-2 flex-wrap gap-1">
                            <input type="text" value={toLine} onChange={e=>setToLine(e.target.value)} className="print-input bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded flex-1 min-w-[180px]" />
                            <span className="font-medium">วันที่ {formatThaiDate(selectedDate)}</span>
                        </div>
                        <textarea value={introText} onChange={e=>setIntroText(e.target.value)} rows="2" className="print-input text-sm w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded mb-3 resize-none" />

                        <div className="overflow-x-auto border border-gray-800">
                            <table className="min-w-full border-collapse text-xs sm:text-sm">
                                <thead>
                                    <tr className="bg-gray-50">
                                        <th rowSpan="3" className="border border-gray-800 px-2 py-1 w-10">ที่</th>
                                        <th rowSpan="3" className="border border-gray-800 px-2 py-1 w-44">ครูที่ไม่ได้มาปฏิบัติราชการ</th>
                                        <th rowSpan="3" className="border border-gray-800 px-2 py-1 w-20">ข้อมูล การสอนแทน</th>
                                        <th colSpan={PERIOD_TIMES.length + 1} className="border border-gray-800 px-2 py-1">คาบที่</th>
                                    </tr>
                                    <tr className="bg-gray-50">
                                        {PERIOD_TIMES.slice(0,4).map(pt => <th key={pt.period} className="border border-gray-800 px-2 py-1 w-16">{pt.period}</th>)}
                                        <th className="border border-gray-800 px-1 py-1 w-8">พัก</th>
                                        {PERIOD_TIMES.slice(4).map(pt => <th key={pt.period} className="border border-gray-800 px-2 py-1 w-16">{pt.period}</th>)}
                                    </tr>
                                    <tr className="bg-gray-50 text-[10px] sm:text-xs">
                                        {PERIOD_TIMES.slice(0,4).map(pt => <th key={pt.period} className="border border-gray-800 px-1 py-1 font-normal">{pt.time}</th>)}
                                        <th className="border border-gray-800 px-1 py-1"></th>
                                        {PERIOD_TIMES.slice(4).map(pt => <th key={pt.period} className="border border-gray-800 px-1 py-1 font-normal">{pt.time}</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {dayLeaves.length === 0 && (
                                        <tr><td colSpan={PERIOD_TIMES.length + 4} className="border border-gray-800 text-center py-6 text-gray-400">ไม่มีรายการลา/จัดสอนแทนในวันที่เลือก</td></tr>
                                    )}
                                    {dayLeaves.map((l, idx) => {
                                        const tasksForLeave = tasks.filter(t => t.leaveId === l.id);
                                        const rowLabels = ['วิชา', 'ชั้น', 'ผู้สอนแทน'];
                                        const isOtherReason = !REASON_OPTIONS.includes(l.reason);
                                        return rowLabels.map((label, rIdx) => (
                                            <tr key={l.id + '-' + label}>
                                                {rIdx === 0 && <td rowSpan="3" className="border border-gray-800 px-2 py-1 text-center align-top">{idx + 1}</td>}
                                                {rIdx === 0 && (
                                                    <td rowSpan="3" className="border border-gray-800 px-2 py-1 align-top">
                                                        <div className="font-semibold">{getTeacherName(l.requesterId)}</div>
                                                        <div className="mt-1 space-y-0.5 text-[11px]">
                                                            {REASON_OPTIONS.map(r => (
                                                                <div key={r} className="flex items-center gap-1">
                                                                    <span className="inline-block w-3 h-3 border border-gray-700 text-center leading-3">{l.reason === r ? '✓' : ''}</span>
                                                                    <span>{r}</span>
                                                                </div>
                                                            ))}
                                                            <div className="flex items-center gap-1">
                                                                <span className="inline-block w-3 h-3 border border-gray-700 text-center leading-3">{isOtherReason ? '✓' : ''}</span>
                                                                <span>อื่นๆ {isOtherReason ? `(${l.reason})` : ''}</span>
                                                            </div>
                                                        </div>
                                                    </td>
                                                )}
                                                <td className="border border-gray-800 px-2 py-1 text-center font-medium text-gray-600">{label}</td>
                                                {PERIOD_TIMES.slice(0,4).map(pt => {
                                                    const t = tasksForLeave.find(x => x.period === pt.period);
                                                    return <td key={pt.period} className="border border-gray-800 px-1 py-1 text-center">{t ? (label === 'วิชา' ? getSubjectDisplay(t.subject) : label === 'ชั้น' ? t.classGroup : getShortSubName(t.assignedTo)) : ''}</td>;
                                                })}
                                                <td className="border border-gray-800 bg-gray-50"></td>
                                                {PERIOD_TIMES.slice(4).map(pt => {
                                                    const t = tasksForLeave.find(x => x.period === pt.period);
                                                    return <td key={pt.period} className="border border-gray-800 px-1 py-1 text-center">{t ? (label === 'วิชา' ? getSubjectDisplay(t.subject) : label === 'ชั้น' ? t.classGroup : getShortSubName(t.assignedTo)) : ''}</td>;
                                                })}
                                            </tr>
                                        ));
                                    })}
                                </tbody>
                            </table>
                        </div>

                        <input type="text" value={closingLine} onChange={e=>setClosingLine(e.target.value)} className="print-input text-sm w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded mt-4" />

                        <div className="flex justify-end mt-10">
                            <div className="text-center text-sm">
                                <div>ลงชื่อ......................................................</div>
                                <input type="text" value={signerName} onChange={e=>setSignerName(e.target.value)} className="print-input text-center w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded mt-1" />
                                <input type="text" value={signerTitle} onChange={e=>setSignerTitle(e.target.value)} className="print-input text-center w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal-200 rounded" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ToggleSwitch({ checked, onChange, name, defaultChecked }) {
            return (
                <label className="relative inline-flex items-center cursor-pointer mr-2">
                    <input type="checkbox" name={name} defaultChecked={defaultChecked} checked={checked} onChange={onChange} className="sr-only peer" />
                    <div className="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500 shadow-inner"></div>
                </label>
            );
        }

        function MenuBtn({active, onClick, icon, text}) {
            return <button onClick={onClick} className={`w-full flex items-center px-3 py-2 text-sm font-medium rounded-lg transition-colors ${active ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:bg-gray-100'}`}><i className={`fas ${icon} w-6`}></i>{text}</button>;
        }

        function AdminSettings({ db, manageTermId, setManageTermId, actions, askConfirm, showToast }) {
            const [tab, setTab] = useState('system'); 
            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row min-h-[600px] overflow-hidden">
                    <div className="w-full md:w-64 bg-gray-50 border-b md:border-b-0 md:border-r border-gray-200 flex flex-col">
                        <div className="p-4 font-bold text-gray-800 border-b border-gray-200 flex items-center"><i className="fas fa-database text-purple-600 mr-2"></i>ตั้งค่าระบบ</div>
                        <div className="p-3 border-b border-gray-200 bg-indigo-50"><label className="block text-xs font-semibold text-indigo-800 mb-1">เลือกภาคเรียนที่ต้องการตั้งค่าข้อมูล:</label><select className="w-full border border-indigo-200 rounded p-1.5 text-sm focus:ring-indigo-500 bg-white font-medium text-indigo-900 outline-none" value={manageTermId} onChange={e=>setManageTermId(e.target.value)}>{db.terms.map(t => <option key={t.id} value={t.id}>{t.name} {t.isCurrent ? '(ปัจจุบัน)' : ''}</option>)}</select></div>
                        <nav className="flex-1 p-2 space-y-1 overflow-y-auto">
                            <MenuBtn active={tab==='system'} onClick={()=>setTab('system')} icon="fa-sliders-h" text="ตั้งค่าระบบพื้นฐาน" />
                            <MenuBtn active={tab==='autoRules'} onClick={()=>setTab('autoRules')} icon="fa-robot" text="เงื่อนไขจัดอัตโนมัติ" />
                            <hr className="my-2 border-gray-200" />
                            <MenuBtn active={tab==='database'} onClick={()=>setTab('database')} icon="fa-server" text="จัดการฐานข้อมูล" />
                            <MenuBtn active={tab==='term'} onClick={()=>setTab('term')} icon="fa-calendar-check" text="จัดการชื่อภาคเรียน" />
                            <MenuBtn active={tab==='timetable'} onClick={()=>setTab('timetable')} icon="fa-calendar-alt" text="จัดการตารางสอน" />
                            <hr className="my-2 border-gray-200" />
                            <MenuBtn active={tab==='teacher'} onClick={()=>setTab('teacher')} icon="fa-users" text="ข้อมูลครูผู้สอน" />
                            <MenuBtn active={tab==='dept'} onClick={()=>setTab('dept')} icon="fa-layer-group" text="ข้อมูลกลุ่มสาระฯ" />
                            <MenuBtn active={tab==='grade'} onClick={()=>setTab('grade')} icon="fa-layer-group" text="ข้อมูลระดับชั้น" />
                            <MenuBtn active={tab==='room'} onClick={()=>setTab('room')} icon="fa-door-open" text="ข้อมูลห้องเรียน" />
                            <MenuBtn active={tab==='subj'} onClick={()=>setTab('subj')} icon="fa-book" text="ข้อมูลรายวิชา" />
                        </nav>
                    </div>
                    <div className="flex-1 p-4 md:p-6 bg-white overflow-y-auto max-h-[800px] custom-scrollbar">
                        {tab === 'system' && (
                            <div className="max-w-xl"><h2 className="text-xl font-bold text-gray-800 mb-6 border-b pb-2">ตั้งค่าระบบพื้นฐาน</h2>
                                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); actions.updateSysConfig({ ...db.sysConfig, name: fd.get('name'), logoUrl: fd.get('logoUrl'), password: fd.get('password'), sheetUrl: fd.get('sheetUrl'), defaultMaxPerDay: parseInt(fd.get('defaultMaxPerDay')) }); }} className="space-y-5 bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-sm">
                                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">ชื่อระบบ (Title)</label><input type="text" name="name" defaultValue={db.sysConfig.name} required className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">URL โลโก้ (Image Link)</label><input type="text" name="logoUrl" defaultValue={db.sysConfig.logoUrl} placeholder="เช่น https://example.com/logo.png" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">URL ของ Google Sheets (ฐานข้อมูล)</label><input type="text" name="sheetUrl" defaultValue={db.sysConfig.sheetUrl} placeholder="https://docs.google.com/spreadsheets/d/..." className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">ลิมิตคาบสอนต่อวัน (สอนปกติ + สอนแทน)</label><input type="number" min="1" max="10" name="defaultMaxPerDay" defaultValue={db.sysConfig.defaultMaxPerDay} required className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-purple-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">รหัสผ่านสำหรับแอดมิน</label><input type="text" name="password" defaultValue={db.sysConfig.password} required className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-purple-500 outline-none font-mono" /></div>
                                    <div className="pt-2"><button type="submit" className="w-full bg-purple-600 text-white font-medium py-3 rounded-lg hover:bg-purple-700 flex items-center justify-center"><i className="fas fa-save mr-2"></i> บันทึกการตั้งค่า</button></div>
                                </form>
                            </div>
                        )}
                        {tab === 'autoRules' && (
                            <div className="max-w-xl"><h2 className="text-xl font-bold text-gray-800 mb-6 border-b pb-2">ตั้งค่าเงื่อนไขระบบจัดอัตโนมัติ (Auto-Assign)</h2>
                                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); actions.updateSysConfig({ ...db.sysConfig, autoRules: { mustMatchDept: fd.get('mustMatchDept') === 'on', mustMatchGrade: fd.get('mustMatchGrade') === 'on', balanceLoad: fd.get('balanceLoad') === 'on', ignoreMaxLoadIfEmpty: fd.get('ignoreMaxLoadIfEmpty') === 'on' } }); }} className="space-y-4 bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-sm">
                                    <div className="flex items-center justify-between p-3 bg-white border rounded-lg"><div><span className="font-semibold text-gray-800">ต้องตรงกลุ่มสาระฯ</span><p className="text-xs text-gray-500">ครูที่สอนแทนต้องอยู่กลุ่มสาระเดียวกับวิชา</p></div><ToggleSwitch name="mustMatchDept" defaultChecked={db.sysConfig.autoRules.mustMatchDept} /></div>
                                    <div className="flex items-center justify-between p-3 bg-white border rounded-lg"><div><span className="font-semibold text-gray-800">ต้องตรงระดับชั้น</span><p className="text-xs text-gray-500">ครูที่สอนแทนต้องสอนในระดับชั้นนั้นอยู่แล้ว</p></div><ToggleSwitch name="mustMatchGrade" defaultChecked={db.sysConfig.autoRules.mustMatchGrade} /></div>
                                    <div className="flex items-center justify-between p-3 bg-white border rounded-lg"><div><span className="font-semibold text-gray-800">กระจายภาระงาน (Load Balancing)</span><p className="text-xs text-gray-500">ให้ความสำคัญกับคนที่สอนแทนน้อยกว่าในสัปดาห์นี้</p></div><ToggleSwitch name="balanceLoad" defaultChecked={db.sysConfig.autoRules.balanceLoad} /></div>
                                    <div className="flex items-center justify-between p-3 bg-white border rounded-lg border-yellow-300 bg-yellow-50"><div><span className="font-semibold text-yellow-800">อนุญาตให้จัดครูที่ลิมิตเต็ม (หากไม่มีคนว่าง)</span><p className="text-xs text-yellow-700">บังคับจับคู่ครูแม้คาบสอนวันนั้นจะเต็มลิมิต</p></div><ToggleSwitch name="ignoreMaxLoadIfEmpty" defaultChecked={db.sysConfig.autoRules.ignoreMaxLoadIfEmpty} /></div>
                                    <div className="pt-4"><button type="submit" className="w-full bg-blue-600 text-white font-medium py-3 rounded-lg hover:bg-blue-700 flex items-center justify-center"><i className="fas fa-save mr-2"></i> บันทึกเงื่อนไข</button></div>
                                </form>
                            </div>
                        )}
                        {tab === 'database' && <DatabaseSettings db={db} actions={actions} askConfirm={askConfirm} showToast={showToast} />}
                        {tab === 'term' && <TermCrud data={db.terms} onSave={actions.addTerm} onToggle={actions.toggleTerm} onDelete={actions.delTerm} onSetCurrent={actions.setCurrentTerm} />}
                        {tab === 'dept' && <SimpleCrud title="จัดการกลุ่มสาระฯ" data={db.departments} columns={[{key:'id', label:'รหัส'}, {key:'name', label:'ชื่อกลุ่มสาระ'}]} onSave={actions.addDept} onToggle={actions.toggleDept} onDelete={actions.delDept} askConfirm={askConfirm} showBulkDelete={true} onDeleteBulk={(ids)=>actions.delBulk('departments', ids)} />}
                        {tab === 'grade' && <SimpleCrud title="จัดการระดับชั้น" data={db.grades} columns={[{key:'id', label:'รหัส'}, {key:'name', label:'ระดับชั้น'}]} onSave={actions.addGrade} onToggle={actions.toggleGrade} onDelete={actions.delGrade} askConfirm={askConfirm} showBulkDelete={true} onDeleteBulk={(ids)=>actions.delBulk('grades', ids)} />}
                        {tab === 'room' && <SimpleCrud title="จัดการห้องเรียน" data={db.rooms} columns={[{key:'id', label:'รหัส'}, {key:'name', label:'เลขห้อง'}, {key:'grade', label:'ระดับชั้น', type:'select', options: db.grades.map(g=>g.name)}, {key:'classGroup', label:'ห้อง/ทับ'}]} onSave={actions.addRoom} onToggle={actions.toggleRoom} onDelete={actions.delRoom} askConfirm={askConfirm} />}
                        {tab === 'subj' && <SubjectCrud data={db.subjects} terms={db.terms.filter(t=>t.isActive)} departments={db.departments.filter(d=>d.isActive)} grades={db.grades.filter(g=>g.isActive)} onSave={actions.addSubj} onToggle={actions.toggleSubj} onDelete={actions.delSubj} askConfirm={askConfirm} onDeleteBulk={(ids)=>actions.delBulk('subjects', ids)} showToast={showToast} />}
                        {tab === 'teacher' && <TeacherCrud data={db.teachers} depts={db.departments.map(d=>d.name)} grades={db.grades.map(g=>g.name)} onSave={actions.addTeacher} onToggle={actions.toggleTeacher} onDelete={actions.delTeacher} onAddBulk={actions.addTeacherBulk} onDeleteBulk={actions.deleteTeacherBulk} sysConfig={db.sysConfig} showToast={showToast} askConfirm={askConfirm} />}
                        {tab === 'timetable' && <TimetableManager manageTermId={manageTermId} termName={db.terms.find(t=>t.id===manageTermId)?.name} teachers={db.teachers.filter(t=>t.role==='teacher' && t.isActive)} departments={db.departments.filter(d=>d.isActive)} timetables={db.timetables} subjects={db.subjects.filter(s=>s.isActive)} allSubjects={db.subjects.filter(s=>s.isActive)} rooms={db.rooms.filter(r=>r.isActive)} addTimetableSlot={actions.addTimetableSlot} delTimetableSlot={actions.delTimetableSlot} onAddBulk={actions.addTimetableBulk} onDeleteBulk={actions.deleteTimetableBulk} showToast={showToast} askConfirm={askConfirm} />}
                    </div>
                </div>
            );
        }

        const DatabaseSettings = ({ db, actions, askConfirm, showToast }) => {
            const TABLE_NAMES = {
                'sysConfig': 'การตั้งค่าระบบ',
                'terms': 'ภาคเรียน',
                'departments': 'กลุ่มสาระฯ',
                'grades': 'ระดับชั้น',
                'rooms': 'ห้องเรียน',
                'subjects': 'รายวิชา',
                'teachers': 'ครูผู้สอน',
                'timetables': 'ตารางสอน',
                'leaves': 'ประวัติการลา',
                'substituteTasks': 'ประวัติจัดสอนแทน'
            };

            const allKeys = Object.keys(TABLE_NAMES);
            const [selectedBackup, setSelectedBackup] = useState(allKeys);
            const [selectedRestore, setSelectedRestore] = useState(allKeys);
            const [autoBackup, setAutoBackup] = useState(localStorage.getItem('auto_backup') === 'true');
            const [lastBackup, setLastBackup] = useState(localStorage.getItem('last_backup') || '-');
            const [autoBackupDate, setAutoBackupDate] = useState(localStorage.getItem('auto_backup_date') || '-');
            const [repairResult, setRepairResult] = useState(null);
            
            const fileRef = useRef(null);

            const handleToggleBackup = (key) => {
                if (selectedBackup.includes(key)) setSelectedBackup(selectedBackup.filter(k => k !== key));
                else setSelectedBackup([...selectedBackup, key]);
            };

            const handleToggleRestore = (key) => {
                if (selectedRestore.includes(key)) setSelectedRestore(selectedRestore.filter(k => k !== key));
                else setSelectedRestore([...selectedRestore, key]);
            };

            const getFlatTimetables = () => {
                let flatTimetables = [];
                Object.keys(db.timetables).forEach(termId => {
                    Object.keys(db.timetables[termId]).forEach(teacherId => {
                        Object.keys(db.timetables[termId][teacherId]).forEach(day => {
                            db.timetables[termId][teacherId][day].forEach(slot => {
                                flatTimetables.push({
                                    id: `${termId}_${teacherId}_${day}_${slot.period}`,
                                    termId, teacherId, day: parseInt(day), data: slot
                                });
                            });
                        });
                    });
                });
                return flatTimetables;
            };

            const executeBackup = () => {
                const backupData = {};
                selectedBackup.forEach(k => {
                    if (k === 'timetables') backupData[k] = getFlatTimetables();
                    else if (k === 'sysConfig') backupData[k] = [db.sysConfig]; 
                    else backupData[k] = db[k];
                });
                
                const blob = new Blob([JSON.stringify(backupData)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `smart_substitute_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                
                const now = new Date().toLocaleString('th-TH');
                localStorage.setItem('last_backup', now);
                setLastBackup(now);
                showToast('ดาวน์โหลดไฟล์สำรองข้อมูลเรียบร้อยแล้ว');
            };

            const handleFileRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        askConfirm('ระบบจะเขียนทับข้อมูลในตารางที่คุณเลือกด้วยข้อมูลจากไฟล์นี้ ยืนยันใช่หรือไม่?', async () => {
                            for (const k of selectedRestore) {
                                if (data[k]) {
                                    await actions.replaceTableData(k, data[k]);
                                }
                            }
                            showToast('กู้คืนข้อมูลเสร็จสมบูรณ์');
                        });
                    } catch(err) {
                        showToast('ไฟล์สำรองข้อมูลไม่ถูกต้อง', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const handleToggleAutoBackup = () => {
                const newVal = !autoBackup;
                setAutoBackup(newVal);
                localStorage.setItem('auto_backup', newVal);
                showToast(newVal ? 'เปิดระบบสำรองอัตโนมัติ' : 'ปิดระบบสำรองอัตโนมัติ', 'info');
            };

            const handleRestoreAuto = () => {
                 const dataStr = localStorage.getItem('auto_backup_data');
                 if(!dataStr) return showToast('ไม่พบข้อมูลสำรองอัตโนมัติ', 'error');
                 try {
                      const data = JSON.parse(dataStr);
                      askConfirm('ระบบจะเขียนทับข้อมูลในตารางที่คุณเลือกด้วยข้อมูลสำรองอัตโนมัติล่าสุด ยืนยันใช่หรือไม่?', async () => {
                            for (const k of selectedRestore) {
                                if (data[k]) {
                                    await actions.replaceTableData(k, data[k]);
                                }
                            }
                            showToast('กู้คืนข้อมูลเสร็จสมบูรณ์');
                      });
                 } catch(e) { showToast('ข้อมูลสำรองอัตโนมัติเสียหาย', 'error'); }
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">จัดการฐานข้อมูล (Database & Backup)</h2>
                    
                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div>
                            <h3 className="font-bold text-blue-800"><i className="fas fa-external-link-alt mr-2"></i> ฐานข้อมูล Google Sheets</h3>
                            <p className="text-sm text-blue-600 mt-1">คลิกปุ่มด้านขวาเพื่อเปิดหน้าต่าง Google Sheets ที่ใช้เก็บข้อมูลหลักของระบบ</p>
                        </div>
                        {db.sysConfig.sheetUrl ? (
                            <a href={db.sysConfig.sheetUrl} target="_blank" rel="noopener noreferrer" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm whitespace-nowrap text-center">
                                เปิดฐานข้อมูล
                            </a>
                        ) : (
                            <div className="text-red-500 text-sm font-bold bg-red-50 px-3 py-2 rounded-lg">กรุณาใส่ URL ใน "ตั้งค่าระบบพื้นฐาน" ก่อน</div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h3 className="font-bold text-gray-800 mb-3"><i className="fas fa-download text-green-500 mr-2"></i> สำรองข้อมูล (Backup)</h3>
                            <p className="text-sm text-gray-500 mb-4">ดาวน์โหลดข้อมูลที่เลือกลงเครื่องเป็นไฟล์ .json</p>
                            
                            <div className="grid grid-cols-2 gap-2 mb-4 bg-gray-50 p-3 rounded-lg border">
                                {allKeys.map(k => (
                                    <label key={`bk_${k}`} className="flex items-center text-sm cursor-pointer">
                                        <input type="checkbox" checked={selectedBackup.includes(k)} onChange={()=>handleToggleBackup(k)} className="mr-2 rounded text-green-600" />
                                        {TABLE_NAMES[k]}
                                    </label>
                                ))}
                            </div>
                            
                            <button onClick={executeBackup} disabled={selectedBackup.length===0} className="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white font-medium py-2 rounded-lg transition-colors mb-3">
                                ดาวน์โหลดไฟล์สำรอง
                            </button>
                            <div className="text-xs text-gray-500 text-center">ดาวน์โหลดไฟล์ล่าสุด: <span className="font-bold text-gray-700">{lastBackup}</span></div>

                            <hr className="my-4" />
                            
                            <div className="flex items-center justify-between p-3 bg-indigo-50 border border-indigo-100 rounded-lg">
                                <div>
                                    <span className="font-semibold text-indigo-800 text-sm">สำรองอัตโนมัติ (Local)</span>
                                    <p className="text-xs text-indigo-600">บันทึกลงเบราว์เซอร์ทุกครั้งที่มีการเปลี่ยนแปลง</p>
                                </div>
                                <ToggleSwitch name="autoBackup" checked={autoBackup} onChange={handleToggleAutoBackup} />
                            </div>
                            {autoBackup && <div className="text-xs text-center mt-2 text-indigo-500">สำรองอัตโนมัติล่าสุด: <br/>{autoBackupDate}</div>}
                        </div>

                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h3 className="font-bold text-gray-800 mb-3"><i className="fas fa-upload text-orange-500 mr-2"></i> กู้คืนข้อมูล (Restore)</h3>
                            <p className="text-sm text-gray-500 mb-4">อัปโหลดไฟล์ .json เพื่อเขียนทับข้อมูลในตารางที่เลือก</p>
                            
                            <div className="grid grid-cols-2 gap-2 mb-4 bg-gray-50 p-3 rounded-lg border">
                                {allKeys.map(k => (
                                    <label key={`rs_${k}`} className="flex items-center text-sm cursor-pointer">
                                        <input type="checkbox" checked={selectedRestore.includes(k)} onChange={()=>handleToggleRestore(k)} className="mr-2 rounded text-orange-600" />
                                        {TABLE_NAMES[k]}
                                    </label>
                                ))}
                            </div>
                            
                            <input type="file" accept=".json" ref={fileRef} onChange={handleFileRestore} className="hidden" />
                            <button onClick={()=>fileRef.current.click()} disabled={selectedRestore.length===0} className="w-full bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 text-white font-medium py-2 rounded-lg transition-colors mb-3">
                                กู้คืนจากไฟล์ (.json)
                            </button>
                            
                            {autoBackup && (
                                <button onClick={handleRestoreAuto} disabled={selectedRestore.length===0} className="w-full mt-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium py-2 rounded-lg transition-colors border border-indigo-200 text-sm">
                                    กู้คืนจากระบบสำรองอัตโนมัติ
                                </button>
                            )}
                            <div className="text-xs text-gray-500 text-center mt-3 text-red-500 font-medium"><i className="fas fa-exclamation-triangle"></i> ข้อมูลจะถูกเขียนทับทันที โปรดระมัดระวัง</div>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border-2 border-dashed border-amber-300 shadow-sm">
                        <h3 className="font-bold text-gray-800 mb-1"><i className="fas fa-magic text-amber-500 mr-2"></i> ปรุงฐานข้อมูล (เฉพาะแอดมิน)</h3>
                        <p className="text-sm text-gray-500 mb-4">ตรวจสอบข้อมูลทั้งระบบและปรับปรุงให้สัมพันธ์กันโดยอัตโนมัติ เช่น ลบคาบสอน/ใบลา/คาบสอนแทนที่อ้างอิงถึงครู วิชา หรือห้องที่ถูกลบไปแล้ว, อัปเดตชื่อวิชา-ห้อง-ชั้นในตารางสอนให้ตรงกับข้อมูลล่าสุด, และซิงค์รายชื่อกลุ่มสาระฯ/ระดับชั้นของครูให้ตรงกับรายการที่มีอยู่จริง</p>
                        <button
                            onClick={() => askConfirm('ระบบจะตรวจสอบข้อมูลทั้งหมด (ตารางสอน, การลา, คาบสอนแทน, ข้อมูลครู) และปรับปรุง/ลบรายการที่ไม่สัมพันธ์กันโดยอัตโนมัติ การกระทำนี้ไม่สามารถย้อนกลับได้ ต้องการดำเนินการหรือไม่?', async () => {
                                const result = await actions.repairDatabase();
                                setRepairResult(result);
                                const totalFixed = result.fixedSlots + result.fixedTasks + result.fixedTeachers;
                                const totalRemoved = result.removedSlots + result.removedTasks + result.removedLeaves;
                                if (totalFixed === 0 && totalRemoved === 0) showToast('ตรวจสอบแล้ว ข้อมูลทั้งหมดสัมพันธ์กันถูกต้องดีอยู่แล้ว');
                                else showToast(`ปรุงฐานข้อมูลสำเร็จ: แก้ไข ${totalFixed} รายการ, ลบข้อมูลไม่สมบูรณ์ ${totalRemoved} รายการ`);
                            })}
                            className="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm"
                        >
                            <i className="fas fa-broom mr-2"></i>เริ่มปรุงฐานข้อมูล
                        </button>
                        {repairResult && (
                            <div className="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-3 text-center">
                                <div className="bg-indigo-50 border border-indigo-100 rounded-lg p-2"><div className="text-xl font-bold text-indigo-700">{repairResult.fixedSlots}</div><div className="text-xs text-indigo-500">ซิงค์คาบสอน</div></div>
                                <div className="bg-red-50 border border-red-100 rounded-lg p-2"><div className="text-xl font-bold text-red-700">{repairResult.removedSlots}</div><div className="text-xs text-red-500">ลบคาบสอนที่เสีย</div></div>
                                <div className="bg-amber-50 border border-amber-100 rounded-lg p-2"><div className="text-xl font-bold text-amber-700">{repairResult.removedLeaves}</div><div className="text-xs text-amber-500">ลบใบลาที่เสีย</div></div>
                                <div className="bg-orange-50 border border-orange-100 rounded-lg p-2"><div className="text-xl font-bold text-orange-700">{repairResult.fixedTasks}</div><div className="text-xs text-orange-500">แก้ไขคาบสอนแทน</div></div>
                                <div className="bg-rose-50 border border-rose-100 rounded-lg p-2"><div className="text-xl font-bold text-rose-700">{repairResult.removedTasks}</div><div className="text-xs text-rose-500">ลบคาบสอนแทนที่เสีย</div></div>
                                <div className="bg-green-50 border border-green-100 rounded-lg p-2"><div className="text-xl font-bold text-green-700">{repairResult.fixedTeachers}</div><div className="text-xs text-green-500">ซิงค์ข้อมูลครู</div></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ========================================================
        // SubjectCrud — จัดการรายวิชา พร้อม CSV Import/Export และกรองตามภาคเรียน
        // ========================================================
        const SubjectCrud = ({ data, terms, departments, grades, onSave, onToggle, onDelete, onDeleteBulk, askConfirm, showToast }) => {
            const [editItem, setEditItem] = useState({ isNew: true });
            const [isEditing, setIsEditing] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);
            const [filterTermId, setFilterTermId] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const fileInputRef = useRef(null);

            const processedData = useMemo(() => {
                let list = [...data];
                if (filterTermId) {
                    list = list.filter(s => {
                        if (!s.termId) return true; // ถ้าไม่ได้ระบุ ถือว่าใช้ได้ทุกเทอม
                        return s.termId.split(',').map(v=>v.trim()).includes(filterTermId);
                    });
                }
                if (searchTerm) {
                    const q = searchTerm.toLowerCase();
                    list = list.filter(s => `${s.id} ${s.code} ${s.name} ${s.dept} ${s.grade}`.toLowerCase().includes(q));
                }
                return list;
            }, [data, filterTermId, searchTerm]);

            const handleSave = (e) => {
                e.preventDefault();
                const { isNew, ...itemToSave } = editItem;
                if (!itemToSave.id) itemToSave.id = 'S' + Date.now().toString().slice(-5);
                onSave(itemToSave);
                setIsEditing(false); setEditItem({ isNew: true });
            };

            const openNew  = () => { setEditItem({ isNew: true, isActive: true }); setIsEditing(true); };
            const openEdit = (row) => { setEditItem({ ...row, isNew: false }); setIsEditing(true); };

            const toggleSelect = (id) => setSelectedIds(p => p.includes(id) ? p.filter(x=>x!==id) : [...p, id]);
            const toggleAll    = (e) => setSelectedIds(e.target.checked ? processedData.map(d=>d.id) : []);

            // ---- CSV helpers ----
            const getTemplate = () => {
                const header = 'รหัสระบบ,รหัสวิชา,ชื่อวิชา,กลุ่มสาระฯ,ระดับชั้น,ห้อง,ภาคเรียน(คั่นด้วย ;)';
                const ex1 = 'S05,ค22101,คณิตศาสตร์พื้นฐาน ม.2,คณิตศาสตร์,ม.2,ทั้งหมด,TERM_2569_1;TERM_2569_2';
                const ex2 = 'S06,ว22101,วิทยาศาสตร์และเทคโนโลยี,วิทยาศาสตร์,ม.2,ทั้งหมด,TERM_2569_1';
                downloadCSV('subject_template.csv', [header, ex1, ex2].join('\n'));
            };

            const handleImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const rows = parseCSV(ev.target.result);
                    if (rows.length < 2) return showToast('ไฟล์ไม่ถูกต้อง', 'error');
                    const items = []; const errors = [];
                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (!r[0]) continue;
                        const termIdRaw = (r[6] || '').trim().split(';').map(v=>v.trim()).filter(Boolean).join(', ');
                        items.push({ id: r[0].trim(), code: r[1].trim(), name: r[2].trim(), dept: r[3].trim(), grade: r[4].trim(), room: r[5].trim() || 'ทั้งหมด', termId: termIdRaw, isActive: true });
                    }
                    if (items.length > 0) { items.forEach(it => onSave(it)); showToast(`นำเข้าวิชาสำเร็จ ${items.length} รายการ`); }
                    else showToast('ไม่พบข้อมูลที่นำเข้าได้', 'error');
                    if (errors.length) console.warn(errors);
                };
                reader.readAsText(file, 'UTF-8');
                e.target.value = null;
            };

            // TermId tag display helper
            const termLabel = (termId) => {
                if (!termId) return <span className="text-gray-300 text-xs">ทุกเทอม</span>;
                return termId.split(',').map(v=>v.trim()).filter(Boolean).map(tid => {
                    const t = terms.find(x=>x.id===tid);
                    return t ? <span key={tid} className="bg-indigo-100 text-indigo-700 text-xs px-1.5 py-0.5 rounded mr-1 border border-indigo-200">{t.name}</span> : null;
                });
            };

            return (
                <div>
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
                        <h2 className="text-xl font-bold text-gray-800">จัดการรายวิชา</h2>
                        <div className="flex flex-wrap gap-2">
                            {selectedIds.length > 0 && <button onClick={()=>askConfirm(`ยืนยันลบ ${selectedIds.length} รายการ?`, ()=>{onDeleteBulk(selectedIds); setSelectedIds([]);})} className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-sm font-medium"><i className="fas fa-trash-alt mr-1"></i>ลบ ({selectedIds.length})</button>}
                            <button onClick={getTemplate} className="bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm hover:bg-gray-300"><i className="fas fa-download mr-1"></i>โหลดแม่แบบ CSV</button>
                            <button onClick={()=>fileInputRef.current.click()} className="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-sm hover:bg-indigo-200"><i className="fas fa-upload mr-1"></i>นำเข้า CSV (UTF-8)</button>
                            <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={handleImport} />
                            <button onClick={openNew} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm font-medium"><i className="fas fa-plus mr-1"></i>เพิ่มวิชา</button>
                        </div>
                    </div>

                    {/* Filters */}
                    <div className="flex flex-wrap gap-3 mb-4 p-3 bg-gray-50 rounded-lg border">
                        <div>
                            <label className="block text-xs font-semibold text-gray-600 mb-1">กรองตามภาคเรียน</label>
                            <select className="border rounded-lg p-1.5 text-sm bg-white" value={filterTermId} onChange={e=>setFilterTermId(e.target.value)}>
                                <option value="">ทั้งหมด</option>
                                {terms.map(t=><option key={t.id} value={t.id}>{t.name}{t.isCurrent ? ' (ปัจจุบัน)' : ''}</option>)}
                            </select>
                        </div>
                        <div className="flex-1">
                            <label className="block text-xs font-semibold text-gray-600 mb-1">ค้นหาวิชา</label>
                            <div className="relative">
                                <i className="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                                <input type="text" placeholder="รหัส / ชื่อวิชา / กลุ่มสาระ..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full pl-7 pr-3 py-1.5 border rounded-lg text-sm focus:ring-purple-500 outline-none" />
                            </div>
                        </div>
                    </div>

                    {/* Edit Form */}
                    {isEditing && (
                        <form onSubmit={handleSave} className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 shadow-sm space-y-3">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div><label className="block text-xs font-semibold text-gray-700 mb-1">รหัสระบบ</label><input required disabled={!editItem.isNew} type="text" placeholder="S05" className="w-full border rounded-lg p-2 text-sm disabled:bg-gray-100" value={editItem.id||''} onChange={e=>setEditItem({...editItem,id:e.target.value})} /></div>
                                <div><label className="block text-xs font-semibold text-gray-700 mb-1">รหัสวิชา</label><input required type="text" placeholder="ค22101" className="w-full border rounded-lg p-2 text-sm" value={editItem.code||''} onChange={e=>setEditItem({...editItem,code:e.target.value})} /></div>
                                <div><label className="block text-xs font-semibold text-gray-700 mb-1">ชื่อวิชา</label><input required type="text" placeholder="คณิตศาสตร์พื้นฐาน" className="w-full border rounded-lg p-2 text-sm" value={editItem.name||''} onChange={e=>setEditItem({...editItem,name:e.target.value})} /></div>
                                <div><label className="block text-xs font-semibold text-gray-700 mb-1">กลุ่มสาระฯ</label><select required className="w-full border rounded-lg p-2 text-sm bg-white" value={editItem.dept||''} onChange={e=>setEditItem({...editItem,dept:e.target.value})}><option value="" disabled>-- เลือก --</option>{departments.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}</select></div>
                                <div><label className="block text-xs font-semibold text-gray-700 mb-1">ระดับชั้น</label><select required className="w-full border rounded-lg p-2 text-sm bg-white" value={editItem.grade||''} onChange={e=>setEditItem({...editItem,grade:e.target.value})}><option value="" disabled>-- เลือก --</option>{grades.map(g=><option key={g.id} value={g.name}>{g.name}</option>)}</select></div>
                                <div><label className="block text-xs font-semibold text-gray-700 mb-1">ห้อง</label><input type="text" placeholder="ทั้งหมด หรือ 111, 112" className="w-full border rounded-lg p-2 text-sm" value={editItem.room||''} onChange={e=>setEditItem({...editItem,room:e.target.value})} /></div>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-gray-700 mb-2"><i className="fas fa-calendar-check text-indigo-500 mr-1"></i>ใช้ในภาคเรียน (เลือกได้หลายภาค ถ้าไม่เลือก = ใช้ได้ทุกเทอม)</label>
                                <div className="flex flex-wrap gap-2">
                                    {terms.map(t => {
                                        const vals = (editItem.termId||'').split(',').map(v=>v.trim()).filter(Boolean);
                                        const checked = vals.includes(t.id);
                                        return (
                                            <label key={t.id} className={`inline-flex items-center px-3 py-1.5 rounded-full text-sm border cursor-pointer transition-colors ${checked ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-300 hover:border-indigo-300'}`}>
                                                <input type="checkbox" className="hidden" checked={checked} onChange={()=>{
                                                    let nv = [...vals];
                                                    if (checked) nv = nv.filter(v=>v!==t.id); else nv.push(t.id);
                                                    setEditItem({...editItem, termId: nv.join(', ')});
                                                }} />{t.name}{t.isCurrent ? ' ✓' : ''}
                                            </label>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="flex gap-2 pt-1"><button type="submit" className="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-medium">บันทึก</button><button type="button" onClick={()=>setIsEditing(false)} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-medium">ยกเลิก</button></div>
                        </form>
                    )}

                    {/* Table */}
                    <div className="overflow-x-auto border rounded-lg max-h-[600px] overflow-y-auto">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-100 sticky top-0 z-10">
                                <tr>
                                    <th className="px-3 py-3 text-center w-10"><input type="checkbox" className="rounded" onChange={toggleAll} checked={processedData.length>0 && processedData.every(d=>selectedIds.includes(d.id))} /></th>
                                    <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase">รหัสระบบ</th>
                                    <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase">รหัสวิชา</th>
                                    <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ชื่อวิชา</th>
                                    <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase">กลุ่มสาระ</th>
                                    <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ชั้น</th>
                                    <th className="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ภาคเรียน</th>
                                    <th className="px-3 py-3 text-center text-xs font-semibold text-gray-600 uppercase">สถานะ</th>
                                    <th className="px-3 py-3 text-right text-xs font-semibold text-gray-600 uppercase">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200 bg-white">
                                {processedData.map(row => (
                                    <tr key={row.id} className={!row.isActive ? 'bg-gray-50 opacity-60' : 'hover:bg-gray-50'}>
                                        <td className="px-3 py-3 text-center"><input type="checkbox" className="rounded" checked={selectedIds.includes(row.id)} onChange={()=>toggleSelect(row.id)} /></td>
                                        <td className="px-3 py-3 text-xs text-gray-500 font-mono">{row.id}</td>
                                        <td className="px-3 py-3 text-sm font-semibold text-indigo-700">{row.code}</td>
                                        <td className="px-3 py-3 text-sm text-gray-800">{row.name}</td>
                                        <td className="px-3 py-3 text-sm text-gray-600">{row.dept}</td>
                                        <td className="px-3 py-3 text-sm text-gray-600">{row.grade}</td>
                                        <td className="px-3 py-3 text-sm">{termLabel(row.termId)}</td>
                                        <td className="px-3 py-3 text-center"><ToggleSwitch checked={row.isActive} onChange={()=>onToggle(row.id)} /></td>
